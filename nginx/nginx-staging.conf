# AERORA QUANT — STAGING NGINX CONFIGURATION
#
# This file routes traffic for the unified staging architecture.
# It handles the Next.js frontend, FastAPI backend, and WebSocket server.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    server_tokens off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=100r/s;

    # =============================================================================
    # UPSTREAMS
    # =============================================================================
    upstream frontend {
        server frontend:3000 max_fails=3 fail_timeout=30s;
    }

    upstream backend_api {
        least_conn;
        server backend-api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream websocket_server {
        ip_hash;
        server websocket-server:8002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # =============================================================================
    # SERVERS
    # =============================================================================

    # Main Staging Server (Port 80 to 443 redirect or handling raw HTTP if no certs)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # -------------------------------------------------------------------------
        # WEBSOCKET ENDPOINT
        # -------------------------------------------------------------------------
        location /ws {
            limit_req zone=ws_limit burst=50 nodelay;

            proxy_pass http://websocket_server;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Long timeouts for persistent connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 7d;

            proxy_buffering off;
            proxy_cache off;
        }

        # -------------------------------------------------------------------------
        # REST API ENDPOINT
        # -------------------------------------------------------------------------
        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            # Rewrite /api/foo to /foo if backend expects root paths
            # (Assuming backend expects / as root based on standard FastAPI layout)
            # If backend expects /api as root, remove the rewrite.
            # rewrite ^/api/(.*) /$1 break;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # -------------------------------------------------------------------------
        # FRONTEND APPLICATION
        # -------------------------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                proxy_pass http://frontend;
            }
        }
    }
}
