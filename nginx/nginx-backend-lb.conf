# =============================================================================
# NGINX LOAD BALANCER — Backend Horizontal Scaling
# =============================================================================
#
# STEP 2: BACKEND HORIZONTAL SCALING
#
# Features:
# - Round-robin load balancing across multiple backends
# - Health checks with automatic failover
# - Connection limits and rate limiting
# - WebSocket support
# - SSL/TLS termination

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream info
    log_format lb_log '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'backend=$upstream_addr '
                      'rt=$request_time '
                      'uct=$upstream_connect_time '
                      'uht=$upstream_header_time '
                      'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log lb_log;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json 
                 application/javascript application/xml+rss 
                 application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=order_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =============================================================================
    # UPSTREAM: Backend API (Round Robin)
    # =============================================================================
    upstream backend_api {
        # Round-robin load balancing (default)
        # Requests distributed evenly across all backends

        # Health check parameters
        zone upstream_backend 64k;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;

        # Backend servers with health checks
        server backend-1:8000 weight=1 max_fails=3 fail_timeout=30s;
        server backend-2:8000 weight=1 max_fails=3 fail_timeout=30s;
        server backend-3:8000 weight=1 max_fails=3 fail_timeout=30s;

        # Backup server (used when all primaries fail)
        server backend-backup:8000 backup;
    }

    # =============================================================================
    # UPSTREAM: WebSocket (IP Hash for sticky sessions)
    # =============================================================================
    upstream websocket_backend {
        # IP hash for WebSocket sticky sessions
        ip_hash;
        
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;

        server websocket-server:8002 weight=1 max_fails=3 fail_timeout=30s;
        server websocket-server-2:8002 weight=1 max_fails=3 fail_timeout=30s;
    }

    # =============================================================================
    # MAIN SERVER BLOCK
    # =============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$server_name$request_uri;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # =============================================================================
        # HEALTH CHECK ENDPOINT (for load balancer monitoring)
        # =============================================================================
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # =============================================================================
        # API ENDPOINTS (Round Robin)
        # =============================================================================
        location /api {
            # Rate limiting
            limit_req zone=api_limit burst=200 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Error handling - try next backend on failure
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Connection header for keepalive
            proxy_set_header Connection "";
        }

        # =============================================================================
        # ORDER ENDPOINTS (Stricter rate limiting)
        # =============================================================================
        location /api/orders {
            # Stricter rate limiting for order placement
            limit_req zone=order_limit burst=50 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # =============================================================================
        # HEALTH ENDPOINTS (No rate limiting)
        # =============================================================================
        location /health {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            # No rate limiting for health checks
            limit_req off;
            limit_conn off;
        }

        # =============================================================================
        # METRICS ENDPOINT (Internal only)
        # =============================================================================
        location /metrics {
            # Restrict to internal IPs
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 10s;
            proxy_read_timeout 10s;
        }

        # =============================================================================
        # WEBSOCKET ENDPOINTS (Sticky sessions)
        # =============================================================================
        location /ws {
            # WebSocket proxy
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for WebSocket
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Disable buffering for real-time
            proxy_buffering off;
            proxy_cache off;

            # Error handling
            proxy_next_upstream error timeout http_502 http_503;
        }

        # =============================================================================
        # STATIC FILES (if any)
        # =============================================================================
        location /static {
            alias /var/www/static;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # =============================================================================
        # DEFAULT LOCATION
        # =============================================================================
        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }

    # =============================================================================
    # HTTPS SERVER (SSL/TLS)
    # =============================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Include same locations as HTTP
        include /etc/nginx/conf.d/locations.conf;
    }
}

# =============================================================================
# STREAM BLOCK (TCP Load Balancing)
# =============================================================================
stream {
    # Redis primary failover
    upstream redis_primary {
        server redis-primary:6379;
    }

    server {
        listen 6379;
        proxy_pass redis_primary;
        proxy_timeout 3s;
        proxy_connect_timeout 1s;
    }
}
