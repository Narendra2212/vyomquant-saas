# STEP 8.3 — Nginx Load Balancer Configuration

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # STEP 8.10: Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # STEP 8.10: Hide nginx version
    server_tokens off;
    
    # STEP 8.10: Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=websocket:10m rate=1000r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/xml+rss 
               application/json;
    
    # STEP 8.3: Upstream backend servers
    upstream backend {
        least_conn;  # Load balancing method
        
        server backend1:8000 max_fails=3 fail_timeout=30s;
        server backend2:8000 max_fails=3 fail_timeout=30s;
        server backend3:8000 max_fails=3 fail_timeout=30s backup;
        
        keepalive 32;  # Keep connections open
    }
    
    # STEP 8.3: Upstream frontend servers
    upstream frontend {
        server frontend:3000 max_fails=3 fail_timeout=30s;
    }
    
    # HTTP to HTTPS redirect (STEP 8.10)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
    
    # STEP 8.3, 8.10: HTTPS Main Server
    server {
        listen 443 ssl http2;
        server_name api.aerora.io;
        
        # STEP 8.10: SSL configuration
        ssl_certificate /etc/nginx/ssl/aerora.crt;
        ssl_certificate_key /etc/nginx/ssl/aerora.key;
        ssl_protocols TLSv1.3;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        
        # STEP 8.10: Rate limiting for API
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 10;
        
        # API endpoints
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
        
        # STEP 8.8: Prometheus metrics (internal only)
        location /metrics {
            allow 10.0.0.0/8;  # Internal network only
            deny all;
            
            proxy_pass http://backend;
        }
        
        # Health check (no rate limit)
        location /health {
            limit_req off;
            proxy_pass http://backend;
        }
    }
    
    # WebSocket server (STEP 8.3, 8.10)
    server {
        listen 443 ssl http2;
        server_name ws.aerora.io;
        
        ssl_certificate /etc/nginx/ssl/aerora.crt;
        ssl_certificate_key /etc/nginx/ssl/aerora.key;
        
        # Higher rate limit for WebSocket
        limit_req zone=websocket burst=100 nodelay;
        
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # WebSocket timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            
            # Disable buffering for WebSocket
            proxy_buffering off;
        }
    }
    
    # Frontend server
    server {
        listen 443 ssl http2;
        server_name app.aerora.io;
        
        ssl_certificate /etc/nginx/ssl/aerora.crt;
        ssl_certificate_key /etc/nginx/ssl/aerora.key;
        
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
