# NGINX Configuration for WebSocket Load Balancing
# 
# STEP 1: WEBSOCKET SCALING
# 
# Features:
# - Load balancing across multiple WebSocket servers
# - Sticky sessions (ip_hash) for connection affinity
# - WebSocket upgrade support
# - Health checks
# - Rate limiting

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format ws_log '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'ws_conn=$connection ws_up=$upstream_addr '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log ws_log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # =============================================================================
    # UPSTREAM: WebSocket Servers
    # =============================================================================
    upstream websocket_servers {
        # Sticky sessions by IP hash
        ip_hash;
        
        # Health check parameters
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
        
        # Backend servers
        server websocket-server:8002 weight=1 max_fails=3 fail_timeout=30s;
        server websocket-server-2:8002 weight=1 max_fails=3 fail_timeout=30s;
        
        # Backup server (for zero-downtime deployments)
        server websocket-server-backup:8002 backup;
    }

    # =============================================================================
    # UPSTREAM: Backend API
    # =============================================================================
    upstream backend_api {
        least_conn;
        keepalive 32;
        
        server backend-api:8000 weight=1 max_fails=3 fail_timeout=30s;
    }

    # =============================================================================
    # SERVER: Main
    # =============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # =============================================================================
        # WEBSOCKET ENDPOINTS
        # =============================================================================
        location /ws {
            # Rate limiting
            limit_req zone=ws_limit burst=20 nodelay;
            limit_conn ws_conn 5;

            # WebSocket proxy settings
            proxy_pass http://websocket_servers;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts (long for WebSocket)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Buffer settings (disable buffering for real-time)
            proxy_buffering off;
            proxy_cache off;

            # Error handling
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;

            # Logging
            access_log /var/log/nginx/websocket_access.log ws_log;
        }

        # =============================================================================
        # REST API ENDPOINTS
        # =============================================================================
        location /api {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts (shorter for API)
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering enabled for API responses
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Error handling
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # =============================================================================
        # HEALTH CHECKS
        # =============================================================================
        location /health {
            proxy_pass http://backend_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
        }
    }

    # =============================================================================
    # HTTPS SERVER (SSL/TLS)
    # =============================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Include same locations as HTTP
        include /etc/nginx/conf.d/locations.conf;
    }
}

# Stream block for TCP load balancing (if needed)
stream {
    # TCP upstream for non-HTTP protocols
    upstream tcp_backend {
        server backend-api:8000;
    }

    server {
        listen 8443;
        proxy_pass tcp_backend;
        proxy_timeout 3s;
        proxy_connect_timeout 1s;
    }
}
