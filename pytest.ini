[pytest]
testpaths =
    tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

pythonpath = . aerora_quant_backend_updated_final1 backend

addopts = -v --tb=short

# tests/perf holds scripted performance experiments, not CI tests. The market data latency
# harness (strategy-builder task 7.6, Requirements 19.11-19.13) measures a live feed over the
# 24 h window design.md prescribes, so a default `pytest -q` run must never collect it.
# Naming the directory here keeps it out of the default lane, while an explicit
# `pytest tests/perf/test_market_data_latency.py` still collects it - which is how the
# experiment is run. Each harness test is gated a second time on the
# AERORA_MARKET_DATA_LATENCY_EXPERIMENT environment variable, so even `pytest tests/perf`
# skips rather than starting a long measurement by accident.
#
# pytest REPLACES its default ignores when this key is set, so the shipped defaults
# (*.egg .* _darcs build CVS dist node_modules venv {arch}) are restated here rather than
# dropped - omitting them makes collection descend into .venv, .hypothesis and
# node_modules.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} tests/perf
