[pytest]
testpaths =
    tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

pythonpath = . aerora_quant_backend_updated_final1 backend

addopts = -v --tb=short

markers =
    realaudit: a test in tests/test_kill03_authoritative_global_halt.py that must exercise
        the GENUINE durable audit writer rather than the stub. That file's autouse
        `no_db_audit` fixture replaces core.safety_audit.record_safety_transition for every
        other test in the module -- not because the real writer would fail (it never
        raises; a failed audit write must not prevent a safety control from engaging) but
        because leaving it live would attempt a real SessionLocal() per transition, making
        those tests slow and dependent on whatever DATABASE_URL happens to be configured.
        Tests carrying this marker opt out of the stub and read their rows back over an
        INDEPENDENT psycopg2 connection, so "it was recorded" means committed and visible
        to another session. They are additionally gated on AERORA_TEST_DATABASE_URL naming
        PostgreSQL and SKIP without it; a skip there is not a pass, and
        test_the_audit_table_requirement_is_explicit asserts the gate exists so the skip
        cannot be silent.
    property_scoreboard: the Requirement 29.3 property-coverage guard in
        tests/property/test_property_coverage.py. It asserts that each of the fifty-eight
        correctness properties has exactly one test_p{n}_ function, and that every one of
        those function names and module paths matches design.md's per-property table
        character for character. It was written before those functions existed
        (marketplace-subscriptions-paper-trading task 2.3) and its collection was gated on
        AERORA_PROPERTY_SCOREBOARD=1 by tests/property/conftest.py while the plan was in
        flight. Task 35.1 closed the scoreboard at 58/58 and deleted that conftest, so the
        guard now runs in the default `pytest tests/` lane and reds CI if a property test is
        deleted, renamed or duplicated. Its assertion was never weakened and the CI selector
        was never changed.
    frontend_bundle: a test whose input is the BUILT frontend bundle, algo22-terminal/dist/.
        Two tests carry it, both in tests/test_no_secrets_in_bundle.py:
        test_no_known_secret_name_appears_in_dist and
        test_only_the_expected_anon_key_jwt_is_present. Their module-scoped `bundle_built`
        fixture calls pytest.fail (not skip) when dist/ is absent, which is correct for a
        developer running locally and was wrong in CI: 01-pr-check.yml's `unit-tests` job
        installs Python and never node, so dist/ cannot exist there and both tests ERRORed on
        the first run of that job that was ever allowed to start. The other five tests in that
        file read the workflow YAML, .env.example and curated name lists, need no bundle, and
        stay in the `unit-tests` lane.
        THE CHECK IS MOVED, NOT DROPPED. `unit-tests` deselects this marker; the
        `frontend-tests` job selects exactly it, after its own `npm run build`. That job is
        also the one gated on changes under algo22-terminal/**, which is the only way a secret
        can enter the bundle -- a backend-only diff cannot change it. So the gate now runs
        where its input exists and where its subject can actually have changed.

# tests/perf holds scripted performance experiments, not CI tests. The market data latency
# harness (strategy-builder task 7.6, Requirements 19.11-19.13) measures a live feed over the
# 24 h window design.md prescribes, so a default `pytest -q` run must never collect it.
# Naming the directory here keeps it out of the default lane, while an explicit
# `pytest tests/perf/test_market_data_latency.py` still collects it - which is how the
# experiment is run. Each harness test is gated a second time on the
# AERORA_MARKET_DATA_LATENCY_EXPERIMENT environment variable, so even `pytest tests/perf`
# skips rather than starting a long measurement by accident.
#
# pytest REPLACES its default ignores when this key is set, so the shipped defaults
# (*.egg .* _darcs build CVS dist node_modules venv {arch}) are restated here rather than
# dropped - omitting them makes collection descend into .venv, .hypothesis and
# node_modules.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} tests/perf
