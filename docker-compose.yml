# STEP 8.1 — Docker Compose Stack
version: '3.8'

services:
  # STEP 8.1: Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aerora-backend
    restart: unless-stopped
    environment:
      - ENV=production
      - SANDBOX_MODE=true
      - DATABASE_URL=postgresql://aerora:${DB_PASSWORD}@postgres:5432/aerora
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_URL=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      # Must match the training worker's value: the API admits against this figure and
      # the worker re-checks against it, so a disagreement makes one of them wrong.
      - ML_TRAINING_MAX_CONCURRENT_GLOBAL=${ML_TRAINING_MAX_CONCURRENT_GLOBAL:-2}
      # The API serves artifacts through the signed download exchange, so it reads the
      # same directory the worker writes.
      - STRATEGY_MODEL_ARTIFACT_DIR=/app/user_strategies/model_artifacts
      - ALERTS_ENABLED=true
      - ALERT_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALERT_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - backend_logs:/app/logs
      - model_artifacts:/app/user_strategies/model_artifacts
    networks:
      - aerora_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ML/DL TRAINING WORKER
  #
  # WHY THIS SERVICE EXISTS AT ALL
  #   Governed training is queued, not executed inline: the API writes a QUEUED
  #   `training_jobs` row carrying the APPROVED configuration and returns. Something
  #   has to dequeue it. Before this service, nothing did - `startup.sh` launches only
  #   gunicorn - so every governed job sat QUEUED forever while the only training that
  #   actually ran was the ungoverned in-process path that is now closed.
  #
  # WHY IT IS A SEPARATE PROCESS AND NOT A THREAD IN THE API
  #   `training_worker.run_worker`'s own docstring: a fitting job in the same
  #   interpreter as the request handlers and the execution runtime is precisely what
  #   the isolation requirement exists to prevent. The worker shares no state with the
  #   API; its only channels are the `training_jobs` table and the Redis wake-up hint.
  #
  # CONCURRENCY IS THE REPLICA COUNT
  #   One worker runs ONE job at a time, on purpose. Platform-wide concurrency is the
  #   number of these processes, and `ML_TRAINING_MAX_CONCURRENT_GLOBAL` is what the
  #   policy engine admits against - so the two MUST agree. Raise `replicas` and raise
  #   that variable together, or the pool will either refuse work it could do or admit
  #   work it cannot.
  #
  # IT NEEDS THE SERVICE ROLE
  #   A worker holds no request and therefore no JWT, so it uses the service-role
  #   client: `model_versions` has no UPDATE policy, and deactivating a superseded
  #   model version is a backend operation by design (004d's header says so). Without
  #   SUPABASE_SERVICE_ROLE_KEY it starts, logs that it can claim nothing, and reaps.
  #
  # RESOURCES MIRROR THE POLICY, THEY DO NOT REPLACE IT
  #   The memory limit here is the container's backstop. The authoritative bounds are
  #   per job and per plan (`MLTrainingCaps.max_memory_mb`, enforced by
  #   `ml_safety.MemoryMonitor` inside the run), and they are lower. This limit exists
  #   so a defect in the runtime cannot take the host down, not to decide a plan's
  #   allowance.
  training-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "-m", "backend_app.backend.training_worker"]
    environment:
      - ENV=production
      - SANDBOX_MODE=true
      - DATABASE_URL=postgresql://aerora:${DB_PASSWORD}@postgres:5432/aerora
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_URL=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      # The service-role client the worker claims jobs and binds models with.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      # MUST match the replica count below. See the note above.
      - ML_TRAINING_MAX_CONCURRENT_GLOBAL=${ML_TRAINING_MAX_CONCURRENT_GLOBAL:-2}
      # Where trained artifacts land. Shared volume so a restarted worker and the API's
      # signed-download endpoint resolve the same bytes.
      - STRATEGY_MODEL_ARTIFACT_DIR=/app/user_strategies/model_artifacts
      - ALERTS_ENABLED=true
      - ALERT_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALERT_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - postgres
      - redis
    volumes:
      - backend_logs:/app/logs
      - model_artifacts:/app/user_strategies/model_artifacts
    networks:
      - aerora_network
    deploy:
      # Keep in step with ML_TRAINING_MAX_CONCURRENT_GLOBAL above.
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # STEP 8.1: Frontend (Next.js)
  frontend:
    build:
      context: ./algo22-terminal
      dockerfile: Dockerfile.frontend
    container_name: aerora-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.aerora.io
      - NEXT_PUBLIC_WS_URL=wss://api.aerora.io/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aerora_network

  # STEP 8.1: PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aerora-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aerora
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=aerora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aerora_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # STEP 8.1: Redis (STEP 8.6: Separated by DB number)
  redis:
    image: redis:7-alpine
    container_name: aerora-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - aerora_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # STEP 8.3: Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: aerora-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - aerora_network

  # STEP 8.8: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: aerora-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - aerora_network

  # STEP 8.8: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: aerora-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - aerora_network

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:
  # Trained model artifacts. Shared between the worker that writes them and the API
  # that serves them through the signed, ownership-checked download exchange - the
  # `model_versions.artifact_uri` a row records has to resolve in both containers.
  model_artifacts:

networks:
  aerora_network:
    driver: bridge
