# STEP 8.1 — Docker Compose Stack
version: '3.8'

services:
  # STEP 8.1: Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aerora-backend
    restart: unless-stopped
    environment:
      - ENV=production
      - SANDBOX_MODE=true
      - DATABASE_URL=postgresql://aerora:${DB_PASSWORD}@postgres:5432/aerora
      - REDIS_URL=redis://redis:6379/0
      - REDIS_QUEUE_URL=redis://redis:6379/1
      - REDIS_CACHE_URL=redis://redis:6379/2
      - ALERTS_ENABLED=true
      - ALERT_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALERT_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - backend_logs:/app/logs
    networks:
      - aerora_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # STEP 8.1: Frontend (Next.js)
  frontend:
    build:
      context: ./algo22-terminal
      dockerfile: Dockerfile.frontend
    container_name: aerora-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.aerora.io
      - NEXT_PUBLIC_WS_URL=wss://api.aerora.io/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aerora_network

  # STEP 8.1: PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aerora-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aerora
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=aerora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aerora_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # STEP 8.1: Redis (STEP 8.6: Separated by DB number)
  redis:
    image: redis:7-alpine
    container_name: aerora-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - aerora_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # STEP 8.3: Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: aerora-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - aerora_network

  # STEP 8.8: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: aerora-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - aerora_network

  # STEP 8.8: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: aerora-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - aerora_network

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  aerora_network:
    driver: bridge
