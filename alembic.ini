# A generic, single database configuration.

[alembic]
# path to migration script
script_location = backend_app/alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepended_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters which are used to render the
# string following the revision id
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to backend_app/alembic/versions. Represent shared revisions
# version_locations = %(here)s/bar:%(here)s/bat:backend_app/alembic/versions

# set to 'true' to search source files recursively
# recursive_version_locations = false

# the output encoding used when revision files are written from script.py.m slide
# output_encoding = utf-8

sqlalchemy.url = sqlite:///./test_migration.db

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly-generated revision scripts.  See the documentation for further
# detail and examples

# Logging configuration
[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
