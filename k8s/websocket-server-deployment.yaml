# =============================================================================
# STEP 1: WEBSOCKET SCALING — Kubernetes Deployment
# =============================================================================
#
# WebSocket Server Deployment for handling 150+ concurrent connections
# 
# Architecture:
# - 4 replicas of WebSocket server
# - Each replica: 4 workers = 16 total workers
# - Each worker: ~100 connections = 1600 total capacity
# - HPA: Scales 4-20 replicas based on CPU/memory
#
# SERVICES:
# - ClusterIP: Internal communication (backend → WS server)
# - LoadBalancer: External WebSocket connections (optional)
#
# INGRESS:
# - Routes /ws/* to WebSocket servers
# - Sticky sessions enabled for connection affinity

apiVersion: v1
kind: Namespace
metadata:
  name: trading-platform
  labels:
    environment: production
    tier: websocket

---
# =============================================================================
# ConfigMap: WebSocket Server Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-server-config
  namespace: trading-platform
data:
  WS_SERVER_HOST: "0.0.0.0"
  WS_SERVER_PORT: "8002"
  WS_SERVER_WORKERS: "4"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://redis-service:6379"

---
# =============================================================================
# Deployment: WebSocket Server
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-server
  namespace: trading-platform
  labels:
    app: websocket-server
    tier: websocket
    version: v1
spec:
  replicas: 4  # Base replicas (4 × 4 workers = 16 workers)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: websocket-server
  template:
    metadata:
      labels:
        app: websocket-server
        tier: websocket
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: websocket-server
          image: ghcr.io/trading-platform/websocket-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: websocket
              protocol: TCP
          envFrom:
            - configMapRef:
                name: websocket-server-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

---
# =============================================================================
# Service: WebSocket Server (Internal ClusterIP)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: websocket-server
  namespace: trading-platform
  labels:
    app: websocket-server
    tier: websocket
spec:
  type: ClusterIP
  selector:
    app: websocket-server
  ports:
    - port: 8002
      targetPort: 8002
      name: websocket

---
# =============================================================================
# HorizontalPodAutoscaler: WebSocket Server
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: websocket-server-hpa
  namespace: trading-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: websocket-server
  minReplicas: 4   # Minimum for 150 active users
  maxReplicas: 20  # Maximum for 500+ users
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

---
# =============================================================================
# PodDisruptionBudget: WebSocket Server
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: websocket-server-pdb
  namespace: trading-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: websocket-server

---
# =============================================================================
# Ingress: WebSocket Server (with sticky sessions)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-ingress
  namespace: trading-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Enable sticky sessions for WebSocket connections
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "websocket-affinity"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - ws.trading-platform.example.com
      secretName: websocket-tls
  rules:
    - host: ws.trading-platform.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: websocket-server
                port:
                  number: 8002

---
# =============================================================================
# ServiceMonitor: Prometheus Scraping
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: websocket-server-metrics
  namespace: trading-platform
  labels:
    app: websocket-server
spec:
  selector:
    matchLabels:
      app: websocket-server
  endpoints:
    - port: websocket
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

---
# =============================================================================
# PrometheusRule: WebSocket Alerts
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: websocket-server-alerts
  namespace: trading-platform
  labels:
    app: websocket-server
spec:
  groups:
    - name: websocket-server
      rules:
        - alert: WebSocketServerDown
          expr: up{job="websocket-server"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "WebSocket server is down"
            description: "WebSocket server {{ $labels.instance }} has been down for more than 1 minute"
        
        - alert: WebSocketHighConnectionCount
          expr: ws_connections_total > 1500
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High WebSocket connection count"
            description: "WebSocket server has {{ $value }} connections, approaching capacity"
        
        - alert: WebSocketRedisDisconnected
          expr: ws_redis_connected == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "WebSocket server Redis disconnected"
            description: "WebSocket server {{ $labels.instance }} lost Redis connection"

---
# =============================================================================
# NetworkPolicy: WebSocket Server
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: websocket-server-network-policy
  namespace: trading-platform
spec:
  podSelector:
    matchLabels:
      app: websocket-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8002
    # Allow from backend API
    - from:
        - podSelector:
            matchLabels:
              app: backend-api
      ports:
        - protocol: TCP
          port: 8002
  egress:
    # Allow to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
