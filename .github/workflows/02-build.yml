# 02-build.yml — Reusable Container Build & ECR Push Pipeline
name: 02 Build

on:
  workflow_call:
    outputs:
      image_tag:
        description: 'Pushed image tag'
        value: ${{ jobs.build-push.outputs.image_tag }}
      image_digest:
        description: 'Pushed image digest'
        value: ${{ jobs.build-push.outputs.image_digest }}
  push:
    branches: [main, master]

# Serialise builds per ref so the downstream deploy workflows are also serialised.
# cancel-in-progress is FALSE on purpose: 03-deploy.yml fails closed if no ECR
# image exists for a commit SHA, so every pushed SHA must still get built.
concurrency:
  group: ecr-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: vyomquant-api

jobs:
  build-push:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}
      image_digest: ${{ steps.build-image.outputs.image_digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      # CI-02: SHORT-LIVED OIDC CREDENTIALS. No long-lived IAM user key.
      #
      # A previous attempt at exactly this change failed and was reverted, and the cause
      # is worth keeping because the diagnosis went wrong before it went right. Run
      # 41145549134 on main died at this step with:
      #
      #     ##[error]Could not assume role with OIDC:
      #              Not authorized to perform sts:AssumeRoleWithWebIdentity
      #
      # The note left behind blamed the shared OIDC provider's stale ThumbprintList and
      # concluded that fixing it needed another project's agreement, because the provider
      # is tagged Project=deeptech-outreach. THAT WAS WRONG, and wrong in a way that
      # turned a five-minute fix into a "blocked on coordination" entry for days.
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity" means the token
      # VALIDATED and the TRUST POLICY did not match. A bad thumbprint cannot produce it
      # -- that fails earlier, as a TLS/InvalidIdentityToken error -- and AWS has not
      # required a correct thumbprint for token.actions.githubusercontent.com since 2023.
      #
      # THE ACTUAL CAUSE: this repository has GitHub's immutable subject claims enabled.
      # GitHub's own API reports use_immutable_subject=true with
      #     sub_claim_prefix: repo:Narendra2212@126683513/vyomquant-saas@1306233497
      # so the `sub` carries the numeric owner and repository IDs, and the trust policy's
      # name-shaped patterns could never match it. Confirmed empirically rather than from
      # a doc page: a throwaway probe workflow on main printed
      #     sub  repo:Narendra2212@126683513/vyomquant-saas@1306233497:ref:refs/heads/main
      # The role's trust policy now lists both shapes, and nothing about the shared
      # provider was touched.
      #
      # WHY THIS ATTEMPT IS NOT ANOTHER EXPERIMENT. Both halves are verified in advance,
      # which the first attempt could only do for one:
      #   * TRUST -- proven by that probe run actually assuming the role on main and
      #     calling sts:GetCallerIdentity. This genuinely cannot be dry-run;
      #     iam:SimulatePrincipalPolicy does not evaluate web-identity trust.
      #   * PERMISSIONS -- which CAN be simulated, and were. Every AWS action this
      #     workflow and every script it calls makes was enumerated and run through
      #     iam:SimulatePrincipalPolicy against this exact role. That caught two real
      #     problems before they reached a run: iam:PassRole needed its
      #     iam:PassedToService context key, and the role's logs grants were scoped to a
      #     log-group ARN that does not satisfy DescribeLogGroups or GetLogEvents.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::273709947018:role/VyomQuantGithubActionsDeploy-production
          role-session-name: GitHubActions-02-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # CI-02: this used to also tag and push `:latest` alongside the commit-SHA tag.
      # Nothing in the deploy path ever reads it -- scripts/ecs_deploy_and_diagnose.py
      # builds its image_uri as "{ECR_REGISTRY}/vyomquant-api:{IMAGE_TAG}" where IMAGE_TAG
      # is 03-deploy.yml's own `github.event.workflow_run.head_sha || github.sha`, i.e.
      # always the commit SHA -- but a mutable `:latest` tag sitting in the registry is
      # still a live risk: anything that pulls it later (a manual `docker pull`, a stray
      # script, a future workflow written without re-reading this one) gets whatever was
      # built most recently rather than a pinned, known commit. Only the immutable
      # SHA-tagged image is built and pushed now.
      - name: Build and push API image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "=== Building Docker Image ==="
          # CI-03: bakes this image's own commit SHA + build time into it (GET /release.json
          # reads these back at runtime), the backend counterpart to 06-frontend-deploy.yml's
          # dist/release.json stamp.
          docker build \
            --build-arg GIT_SHA=$IMAGE_TAG \
            --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .

          echo "=== Pushing Docker Image ==="
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # CI-02: this used to fall back to echoing $IMAGE_TAG (a tag, not a digest) if
          # `aws ecr describe-images` failed, so a describe failure silently produced an
          # `image_digest` output that was not actually a digest -- indistinguishable from
          # a real one to anything consuming it. Nothing reads this output today (grepped
          # every workflow and script for `image_digest` / `outputs.image_digest`), but an
          # output that lies about its own contents is a trap for whatever is the first
          # thing that ever does. Fail the step instead.
          DIGEST=$(aws ecr describe-images --repository-name $ECR_REPOSITORY --image-ids imageTag=$IMAGE_TAG --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::Could not retrieve a real digest for $ECR_REPOSITORY:$IMAGE_TAG after push; refusing to report a fake one."
            exit 1
          fi

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "=== Pushed Image Digest: $DIGEST ==="
