# STEP 8.9: CI/CD Pipeline - Automated Deployment
#
# GitHub Actions workflow for:
# - Run tests
# - Build Docker image
# - Deploy to staging
# - Run validation
# - Deploy to production

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'
  AWS_REGION: ap-southeast-1

jobs:
  # =============================================================================
  # STEP 8.9: Job 1 - Run Tests
  # =============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i 's/^torch==.*/torch==2.3.1+cpu/' requirements.txt
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          # requirements-dev.txt is optional; skip if absent
          pip install -r backend_app/requirements.txt || true
          pip install pytest pytest-cov flake8 black isort mypy bandit
      
      - name: Run linting
        run: |
          # Lint canonical backend package only
          flake8 backend_app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check backend_app tests
          isort --check-only backend_app tests
      
      - name: Run type checking
        run: mypy backend_app --ignore-missing-imports
      
      - name: Run unit tests
        run: pytest tests/ -v --cov=backend_app --cov-report=xml --cov-report=term
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          PYTHONPATH: .
      
      - name: Run integration tests
        run: pytest tests/ -v -k "not chaos and not load"
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          PYTHONPATH: .
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # =============================================================================
  # STEP 8.9: Job 2 - Security Scan
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Bandit security scan
        run: |
          pip install bandit
          # Scan canonical backend package only
          bandit -r backend_app -f json -o bandit-report.json || true
          bandit -r backend_app -ll
      
      - name: Run Safety check
        run: |
          pip install safety
          safety check
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # STEP 8.9: Job 3 - Build Docker Image
  # =============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # =============================================================================
  # STEP 8.9: Job 4 - Deploy to Staging
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.trading-platform.example.com
    
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy to ECS Staging
        run: |
          aws ecs update-service \
            --cluster trading-platform-staging \
            --service backend \
            --force-new-deployment
      
      - name: Deploy to EKS Staging
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name trading-platform-staging
          kubectl set image deployment/trading-backend \
            backend=${{ needs.build.outputs.image_tag }} \
            -n staging
          kubectl rollout status deployment/trading-backend -n staging --timeout=300s
      
      - name: Notify deployment
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 Deployed to STAGING",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Trading Platform* deployed to *STAGING*\n• Commit: ${{ github.sha }}\n• Image: ${{ needs.build.outputs.image_tag }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # =============================================================================
  # STEP 8.9: Job 5 - Run Validation (Staging)
  # =============================================================================
  validate-staging:
    name: Validate Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Wait for deployment
        run: sleep 60
      
      - name: Health check
        run: |
          curl -sf https://staging.trading-platform.example.com/health || exit 1
          curl -sf https://staging.trading-platform.example.com/health/ready || exit 1
      
      - name: Run smoke tests
        run: |
          pip install pytest requests
          pytest tests/smoke -v --base-url=https://staging.trading-platform.example.com
      
      - name: Run integration tests
        run: |
          pytest tests/e2e -v --base-url=https://staging.trading-platform.example.com
      
      - name: Performance check
        run: |
          curl -o /dev/null -s -w "%{http_code} %{time_total}s\n" \
            https://staging.trading-platform.example.com/metrics
      
      - name: Validate monitoring
        run: |
          # Check Prometheus metrics are available
          curl -sf http://staging.prometheus:9090/api/v1/status/targets || echo "Prometheus check skipped"

  # =============================================================================
  # STEP 8.9: Job 6 - Deploy to Production
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-staging
    environment:
      name: production
      url: https://trading-platform.example.com
    
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy to EKS Production (Canary)
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name trading-platform-production
          
          # Deploy canary (10% traffic)
          kubectl set image deployment/trading-backend-canary \
            backend=${{ needs.build.outputs.image_tag }} \
            -n production
          kubectl rollout status deployment/trading-backend-canary -n production --timeout=300s
          
          # Wait for canary validation
          sleep 300
      
      - name: Canary health check
        run: |
          # Check canary pods are healthy
          kubectl get pods -n production -l version=canary
          
          # Run canary smoke tests
          curl -sf https://trading-platform.example.com/health || exit 1
      
      - name: Promote to full deployment
        run: |
          # Promote canary to full deployment
          kubectl set image deployment/trading-backend \
            backend=${{ needs.build.outputs.image_tag }} \
            -n production
          kubectl rollout status deployment/trading-backend -n production --timeout=600s
          
          # Scale canary to 0
          kubectl scale deployment/trading-backend-canary --replicas=0 -n production
      
      - name: Verify production deployment
        run: |
          kubectl get pods -n production
          curl -sf https://trading-platform.example.com/health
          curl -sf https://trading-platform.example.com/metrics
      
      - name: Notify deployment
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 Deployed to PRODUCTION",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Trading Platform* deployed to *PRODUCTION* ✅\n• Commit: ${{ github.sha }}\n• Image: ${{ needs.build.outputs.image_tag }}\n• Canary validated before full rollout"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Changes
            - Commit: ${{ github.sha }}
            - Docker Image: ${{ needs.build.outputs.image_tag }}
            
            ## Deployment
            - ✅ Staging validated
            - ✅ Canary deployed
            - ✅ Production deployed
          draft: false
          prerelease: false
