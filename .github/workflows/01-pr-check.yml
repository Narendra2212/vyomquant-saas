# 01-pr-check.yml — Pull Request Validation Pipeline
name: 01 PR Check

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  # CI-01: ALSO run on the commit that lands on main. 03 Deploy refuses a commit that has no
  # passing "01 PR Check" run (scripts/require_tests_passed.py); a squash/merge commit has a
  # new SHA that no pull_request run ever saw, so without this trigger every deploy would be
  # refused for lack of a run - and a deploy without one would be ungated.
  push:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.11'
  # Matches the Node version 06-frontend-deploy.yml builds the shipped bundle with, so the
  # PR gate and the deploy build agree. Read only by the frontend-tests job below; no
  # pre-existing job references it.
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────────────────────────────────────
  # THIS JOB WAS SPLIT IN TWO, AND THAT IS THE WHOLE POINT OF THE CHANGE.
  #
  # It used to be one `validate-code` job running the import audit, the dependency audit,
  # flake8, `black --check backend_app` and `isort --check-only backend_app`. Every other
  # job in this workflow declares `needs: validate-code`.
  #
  # `black --check backend_app` FAILS, and has failed on every run of this workflow. The
  # measurement, taken against the tree as it stands: 350 of the 382 files under
  # `backend_app/` would be reformatted, and 142 have import order isort disagrees with.
  # There is no `pyproject.toml`, no `setup.cfg`, no `.isort.cfg` and no `tox.ini` anywhere
  # in the repository, so both tools run on pure defaults against a codebase that was never
  # formatted with them.
  #
  # `gh run list --workflow 01-pr-check.yml` returns five runs and five failures, the
  # oldest from 2026-08-29. `gh run view` on the most recent shows `Code Quality & Static
  # Audit` passing the import audit, the dependency audit and flake8, then failing at
  # `Black Format Check` with `Isort Check` skipped -- and `Unit & Integration Tests`,
  # `Database Tests (PostgreSQL)` and `Docker Build Validation` absent from the job list
  # entirely, because `needs:` never let them start.
  #
  # So the consequence is not a style backlog. It is that THE 11,869-TEST BACKEND SUITE HAS
  # NEVER EXECUTED IN CI, and neither has the PostgreSQL lane that task 13.21 built or the
  # Docker validation. A cosmetic check was standing in front of every substantive one.
  #
  # The fix keeps both checks and changes what they can block:
  #   `static-audit`  -- import audit, dependency audit, flake8. Blocking, and what the
  #                      test jobs now depend on. These are correctness checks: flake8 is
  #                      scoped to E9/F63/F7/F82 (syntax errors and undefined names) and
  #                      currently reports 0.
  #   `format-check`  -- black and isort, `continue-on-error: true`. Nothing depends on it.
  #                      It reports the backlog on every run instead of blocking on it.
  #
  # NOT FIXED BY REFORMATTING, DELIBERATELY. `black backend_app` would rewrite 350 files in
  # one commit, conflicting with every branch in flight, and `isort backend_app` would
  # reorder imports in 142 more -- in a codebase where module import order has side effects
  # (`backend/ml_models.py` probes tensorflow and joblib at import; `core/rate_limit.py`
  # raises at import when REDIS_URL is absent outside dev). That is a project with its own
  # verification, not a step on the way to a launch, and it buys no launch safety. Adopting
  # the formatting is the intended follow-up: format a directory at a time, drop
  # `continue-on-error`, and the ratchet is back.
  # ───────────────────────────────────────────────────────────────────────────────
  static-audit:
    name: Code Quality & Static Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-cpu.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install flake8 mypy bandit pytest pytest-asyncio

      - name: Automated Import & AST Audit
        run: python scripts/import_audit.py backend_app

      - name: Automated Dependency Audit
        run: python scripts/dependency_audit.py

      - name: Flake8 Check
        run: flake8 backend_app --count --select=E9,F63,F7,F82 --show-source --statistics

  format-check:
    name: Format Backlog (report only)
    runs-on: ubuntu-latest
    # REPORT ONLY. See the block comment above static-audit for the measurement and for why
    # this is not blocking yet. The step-level `continue-on-error` keeps the diff visible in
    # the log; the job-level one keeps the workflow green so the test jobs are what decides
    # whether a pull request is mergeable.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pinned, unlike the original unpinned `pip install black isort`. An unpinned
      # formatter changes its own output between releases, so the size of the backlog this
      # job reports would move without anyone editing a file.
      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          pip install black==24.8.0 isort==5.13.2

      - name: Black Format Check
        continue-on-error: true
        run: black --check --diff backend_app

      - name: Isort Check
        continue-on-error: true
        run: isort --check-only --diff backend_app

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: static-audit
    # This job had NO timeout, which was harmless only while it never ran. It is about to
    # run 12,000+ tests for the first time, and GitHub's default is 360 minutes -- so a
    # single hung test would burn six hours of runner time per pull request before
    # anything reported. Task 13.13 measured the whole suite at 52 minutes; 90 leaves
    # most of that again as headroom while still killing a genuine hang in reasonable
    # time. Raise it from a MEASURED run, not from a failure.
    timeout-minutes: 90

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-cov

      # DELIBERATELY NO `DATABASE_URL` HERE, and this is load-bearing (task 13.21).
      # Without it `core/database_pool.py` falls back to `sqlite:///./algo22.db`, which is
      # what the 11,000+ tests in this lane are measured against and what they must keep
      # being measured against. The PostgreSQL service added for task 13.21 lives in its
      # own `database-tests` job below rather than here, precisely so that pointing a
      # DATABASE_URL at a real server cannot change the behaviour of this lane. Adding
      # one here would silently re-route every `SessionLocal()` in the suite.
      # `-m "not frontend_bundle"` DESELECTS TWO TESTS, AND DOES NOT DROP THEIR CHECK.
      # The first run of this job that was ever allowed to start ERRORed on
      # `test_no_known_secret_name_appears_in_dist` and
      # `test_only_the_expected_anon_key_jwt_is_present`, both with "algo22-terminal/dist/
      # does not exist or is empty". They scan the BUILT frontend bundle, this job installs
      # Python and never node, and their fixture calls `pytest.fail` rather than `skip` --
      # correct for a developer locally, impossible here.
      # They now run in `frontend-tests` below, after that job's own `npm run build`, selected
      # by exactly this marker. That job is additionally gated on changes under
      # `algo22-terminal/**`, which is the only way a secret can reach the bundle: a
      # backend-only diff cannot alter it. The other five tests in that file read the workflow
      # YAML, `.env.example` and curated name lists, need no bundle, and still run here.
      # D5': `AERORA_TEST_REDIS_URL` IS WHAT SWITCHES THE REAL-REDIS TESTS ON.
      #
      # `REDIS_URL` below does NOT, and that was the defect. `tests/conftest.py` runs
      #     os.environ["REDIS_URL"] = ""
      # unconditionally at import, before any test module loads, so that the 11,000+ tests in
      # this lane cannot be re-pointed at a live cache by whatever happens to be exported.
      # That blanking is correct and is deliberately left alone. Its consequence was that the
      # `redis:7-alpine` service above -- healthy, mapped, health-checked -- could never reach
      # the tests that exist to exercise it: they read `REDIS_URL`, found `''`, and SKIPPED on
      # every PR. Three files were affected, and one of them had been dormant since it was
      # written. Measured in `staging/p10k_gate_predicate.txt`.
      #
      # `AERORA_TEST_REDIS_URL` is the second, deliberate name -- the same pattern
      # `AERORA_TEST_DATABASE_URL` already uses for PostgreSQL in the `database-tests` job, and
      # the name `tests/test_webhook_duplicate_delivery_real_redis.py` already read. conftest
      # does not touch it, so it survives to the gate in `tests/real_redis_gate.py`.
      #
      # `/0` IS NOT A FREE CHOICE, AND `/15` WAS MEASURABLY WRONG (Phase 11B-A11/A12).
      #
      # This line said `/15` and the comment claimed it "pins a dedicated database index …
      # belt-and-braces rather than load-bearing". That was false in both halves, and it is
      # the direct cause of two real-Redis webhook failures in run 38047483583.
      #
      # The application cannot be pointed at database 15. `backend_app/backend/redis_manager.py`
      # partitions by purpose -- `REDIS_DB_CACHE = 0`, `REDIS_DB_QUEUE = 1`, `REDIS_DB_EVENTS = 2`
      # -- and `get_redis_url(db)` OVERRIDES whatever database the URL names by appending a
      # `db=` query parameter. For `redis://localhost:6379/15` it produces
      # `redis://localhost:6379/15?db=0`, and redis-py resolves the QUERY over the path:
      #     ConnectionPool.from_url('redis://localhost:6379/15?db=0').connection_kwargs['db'] == 0
      # So the handler under test wrote its idempotency key to database 0 while the test's own
      # client -- which honours the path -- read database 15. The key was never missing; the
      # test was looking in a database the application never uses.
      #
      # That mismatch did not merely fail two tests, it made a third pass for the wrong reason:
      # `test_an_invalid_signature_is_rejected_and_leaves_no_lock_behind` asserts a key is
      # ABSENT, which is trivially true in a database nothing writes to. A keyspace mismatch is
      # therefore not a tidy-up detail; it manufactures false assurance.
      #
      # WHAT THIS LINE IS AND IS NOT RESPONSIBLE FOR, now that the keyspace split is fixed
      # properly in the test. `tests/test_webhook_duplicate_delivery_real_redis.py` no longer
      # builds its client from this variable: it derives the URL from the application's own
      # `get_redis_url(REDIS_DB_CACHE)` and then PROVES both ends see one keyspace with a
      # bidirectional sentinel, failing with "KEYSPACE SPLIT" if they do not. That is the
      # robust fix -- a hard-coded database here would agree today and drift the moment
      # `REDIS_DB_CACHE` or the override changes.
      #
      # This variable's remaining job is the GATE's: it is the endpoint
      # `tests/real_redis_gate.py` PINGs to decide skip / fail / run. `/0` is named so that
      # the database the gate proves reachable is the database the application actually uses,
      # instead of proving database 15 is alive and running the suite against database 0.
      # The isolation the old comment wanted comes from the service container being ephemeral
      # and exclusive to this job, which it already was; no test issues FLUSHDB, and each test
      # namespaces its own keys.
      #
      # `REDIS_URL` is RETAINED unchanged. Several tests assert on how the application behaves
      # when it is present (`test_api03_rate_limit_storage_is_fail_closed.py`,
      # `test_api04_store_failure_after_startup.py`), and conftest blanks it for everyone
      # regardless, so removing it here would change an unrelated lane for no benefit.
      - name: Run Unit Tests
        run: pytest tests/ -v --tb=short -k "not chaos and not load" -m "not frontend_bundle"
        env:
          REDIS_URL: redis://localhost:6379
          AERORA_TEST_REDIS_URL: redis://localhost:6379/0
          ENV: test
          AERORA_MODE: safe
          PYTHONPATH: .

  # ───────────────────────────────────────────────────────────────────────────────
  # THE LANE ABOVE TESTS A POSTURE PRODUCTION NEVER RUNS IN.
  #
  # `AERORA_MODE: safe` there (and `VYOMQUANT_MODE: safe` in `database-tests`) means
  # `SafetyMonitor.check_execution_allowed` refuses EVERY operation:
  #
  #     env_mode = get_vyomquant_mode("safe").lower()
  #     if env_mode == "safe":
  #         return "[BLOCKED] EXECUTION BLOCKED: VYOMQUANT_MODE=safe ..."
  #
  # Production is not in that posture. `ecs-task-definition-full.json` sets
  # `VYOMQUANT_MODE=paper`, so `backend_app/main.py` calls
  # `ExecutionFlags.enable_paper_trading()` at import, which sets
  # `PAPER_TRADING_ENABLED`, `STRATEGY_SIGNAL_EXECUTION` and `ALLOW_ML_INFERENCE` to True
  # and `LIVE_TRADING_ENABLED` / `BACKTEST_CAN_SUBMIT_ORDERS` to False. So every execution
  # path above is exercised with execution BLOCKED, and the per-operation flags that
  # actually govern production are never reached.
  #
  # That gap was measured rather than assumed, and the measurement is the reason this job
  # is narrow. Running the execution-critical files under `VYOMQUANT_MODE=paper` gives
  # 274 passed, 1 xfailed, 0 failed - the same result as `safe`. These files are
  # mode-agnostic today, so this job is not here to fix a known break; it is here so that
  # a future change which is mode-DEPENDENT fails in CI rather than in production.
  #
  # NARROW ON PURPOSE. Re-running all 12,000 tests in a second posture would roughly
  # double the lane's 52-minute measured runtime for a property only the execution paths
  # have. This slice is ~8 minutes and covers the funnel guard, the branch-point
  # assertion, the paper/live separation, the DAG engine's ML gate and the paths that
  # claim an exchange. Add a file here when it starts depending on the execution posture.
  # ───────────────────────────────────────────────────────────────────────────────
  paper-mode-tests:
    name: Execution Tests (production posture)
    runs-on: ubuntu-latest
    needs: static-audit
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio

      # No DATABASE_URL, for the same reason the lane above has none: SQLite is what
      # these files are measured against. The only variable that differs from
      # `unit-tests` is the execution mode, which is the entire point of the job.
      - name: Run execution tests in paper mode
        run: |
          pytest tests/test_simulated_orders_reach_the_simulator.py \
                 tests/test_execution_environment_guard.py \
                 tests/test_execution_engine_mode_matches_its_branch.py \
                 tests/test_execution_environment_is_stated_not_defaulted.py \
                 tests/test_execution_paths_that_claim_an_exchange.py \
                 tests/test_paper_live_separation.py \
                 tests/test_single_execution_pipeline.py \
                 tests/test_execution_correctness.py \
                 tests/test_dag_engine_port_addressing.py \
                 tests/test_ml_executor_does_not_fabricate_predictions.py \
                 -v --tb=short
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          VYOMQUANT_MODE: paper
          PYTHONPATH: .

  # ───────────────────────────────────────────────────────────────────────────────
  # production-launch-hardening task 13.21, defect B.
  #
  # WHY THIS JOB EXISTS. There was no PostgreSQL anywhere in CI -- the `unit-tests` job
  # above has a `services:` block with redis and nothing else -- so three test files that
  # need a real server through `backend_app.core.database.SessionLocal` could not run
  # anywhere, and were carried in task 13.13's inventory as environment gaps. One of them,
  # `tests/test_transaction_isolation_serializable.py`, is the test that would have caught
  # defect A: the SERIALIZABLE isolation control had never once executed, because it was
  # issued as a raw SQL string that SQLAlchemy 2.x rejects and the rejection was swallowed
  # into a `logger.warning`. A control with a test that cannot run is a control with no
  # test.
  #
  # WHY IT IS A SEPARATE JOB rather than a `DATABASE_URL` on `unit-tests`. The 11,000+
  # tests that pass today pass against SQLite. Setting DATABASE_URL on that job would
  # re-point every `SessionLocal()` in the suite at PostgreSQL in one move -- a far larger
  # change than this task, and one with no way to tell a new PostgreSQL-specific failure
  # from a regression. This job sets DATABASE_URL for the handful of files that require it
  # and nothing else.
  #
  # WHAT IT PROVISIONS, AND WHY IT STOPS WHERE IT DOES. `alembic upgrade d97ffff9c3bb`,
  # not `upgrade head`. `d97ffff9c3bb` is the branchpoint (`alembic history` confirms it)
  # and the revision whose `op.create_table('orders', ...)` the cancellation tests need;
  # the path to it from base is linear and unambiguous. `upgrade head` CANNOT provision a
  # fresh database, and that was measured rather than assumed -- see task 13.21 for the
  # transcript. The next revision on one branch, `add_foreign_keys_20260817.py`, adds
  # `FOREIGN KEY (tenant_id) REFERENCES profiles(id)`, and `profiles` has no CREATE TABLE
  # in any migration or SQL file in this repository. Its `try/except Exception` around
  # each statement does not save it: PostgreSQL aborts the whole transaction on the first
  # failed statement, so every statement after the swallow -- including alembic's own
  # `UPDATE alembic_version` -- fails with `InFailedSqlTransaction`. Also note that
  # `4ef23035a692_baseline.py`'s `upgrade()` only DROPs; its CREATE TABLEs are in
  # `downgrade()`, so the baseline alone provisions nothing.
  #
  # `postgres:17-alpine` because production reports `server_version 17.6`. Matching the
  # major version is the point; the password is a throwaway for an ephemeral service
  # container on the runner's loopback interface and is not a credential for anything.
  # ───────────────────────────────────────────────────────────────────────────────
  database-tests:
    name: Database Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: static-audit
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TWO VARIABLES, TWO CONSUMERS, AND THE SECOND ONE IS NOT REDUNDANT.
      # `DATABASE_URL` is what `backend_app/alembic/env.py` reads to set
      # `sqlalchemy.url`, so the provisioning step needs it.
      # `AERORA_TEST_DATABASE_URL` is what `tests/conftest.py` requires before it will
      # let a DATABASE_URL survive into the test process: that conftest blanks
      # DATABASE_URL at import time, deliberately, so that a `.env` placeholder cannot
      # point the suite at a real server. Until task 13.21 it blanked it
      # unconditionally, which is why these test files could not run even where a
      # database existed. Setting only DATABASE_URL here would reproduce that: alembic
      # would provision the schema and pytest would still run against SQLite.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AERORA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ENV: test
      # `VYOMQUANT_MODE` and not `AERORA_MODE`: the latter still works but
      # `core/safety_config.py` emits a deprecation warning telling callers to move.
      VYOMQUANT_MODE: safe
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio

      # `auth.users`/`auth.uid()` are Supabase platform tables this job's bare
      # postgres:17-alpine container does not have. None of this repo's alembic
      # revisions create them -- in real Supabase they already exist -- but
      # `tests/test_atomic_order_cancellation_fix.py`'s `_seeded_tenant` fixture (and
      # `profiles`'s own FK to `auth.users`) needs them before any INSERT.
      #
      # `--also-step0` is the second half of that same fixture: it also inserts into
      # `public.profiles`, which -- like `auth.users` -- predates this repository's
      # alembic history in real production and so is declared (not created by any
      # revision) in `020_declare_pre_existing_tables.sql`. Confirmed via a real CI run
      # (job 117474514312) that --only-substrate alone was not enough: the fixture's
      # first INSERT (auth.users) succeeded but its second (profiles) failed with
      # `relation "public.profiles" does not exist`, the next layer of the same gap.
      #
      # Using `--only-substrate --also-step0` here (rather than the Provisioning job's
      # full `--create-substrate` run) creates exactly these two things and nothing
      # else -- it does not touch this job's own target revision below, which
      # deliberately stops at the branchpoint rather than going to head.
      - name: Create auth substrate + declare pre-existing tables (auth.users, profiles)
        run: |
          python scripts/provision_database.py \
            --dsn "$DATABASE_URL" --apply --create-substrate --also-step0 --only-substrate

      # `backend_app/alembic/env.py` reads DATABASE_URL from the environment and feeds it
      # to `sqlalchemy.url`, so no ini edit is needed. Stops at the branchpoint -- see the
      # block comment above for why `head` is not reachable on an empty database.
      - name: Provision schema
        run: |
          python -m alembic upgrade d97ffff9c3bb
          python -m alembic current

      # TWO FILES, AND ONE DELIBERATE OMISSION.
      #
      # `test_database_isolation_level_postgres.py` is new with task 13.21 and skips
      # itself unless DATABASE_URL names a PostgreSQL server, so it is inert in the
      # `unit-tests` lane and real here. It is the half of defect A's proof that SQLite
      # cannot give: that `SHOW transaction_isolation` actually reports `serializable`.
      #
      # `test_atomic_order_cancellation_fix.py` needs the `orders` table, which the
      # provisioning step above creates. Its fourth test,
      # `test_transaction_isolation_for_cancellation`, is deselected and NOT because it is
      # inconvenient: it asserts that the plain, general `SessionLocal()` reports
      # `serializable`. `core/database.py`'s own design says the opposite -- FINANCIAL is
      # SERIALIZABLE, GENERAL and READ_ONLY are READ COMMITTED -- and nothing outside
      # `backend/paper/paper_repository.py` retries on PostgreSQL's `40001`
      # serialization_failure, so making the shared engine SERIALIZABLE would turn a
      # dormant control into live `could not serialize access` errors. The assertion is
      # left exactly as written and the conflict is recorded in task 13.21 as an open
      # decision. It is not relaxed, and it is not quietly passing either.
      #
      # `tests/test_transaction_isolation_serializable.py` is not selected for the same
      # reason: all three of its tests make that same global-SERIALIZABLE assertion. The
      # environment gap task 13.13 recorded for it is closed -- a PostgreSQL now exists in
      # this job and the file can be invoked against it by hand -- but the design conflict
      # is not, and resolving it is not this task's call. Task 13.21 names it.
      # `test_strategy_lifecycle_concurrency_postgres.py` is new with task 13.23 and is
      # the DATABASE-LEVEL half of clause 1.16 [P0] / 2.16, which tasks 12.6, 13.11,
      # 13.21 and 13.22 all carried BLOCKED for want of a real server. Two genuine
      # PostgreSQL sessions off a `threading.Barrier` -- the technique task 13.11 used
      # for order cancellation -- racing `deploy` against `deploy` and `archive` against
      # `deploy`. It is the regression proof for `021_strategy_deployment_live_
      # uniqueness.sql`, whose partial unique index makes the losing deploy fail with
      # `23505` instead of landing a second live deployment.
      #
      # IT NEEDS NO PROVISIONING STEP, AND THAT IS DELIBERATE RATHER THAN A SHORTCUT.
      # The file builds `strategies` and `strategy_deployments` inside a uniquely named
      # scratch schema it creates and drops, from the columns it parses out of the real
      # declarations (020 for `strategies`, 001 for `strategy_deployments` -- both
      # asserted present by its own source-level tests, which run in the `unit-tests`
      # lane because they need no server). It never reads `public`. So it runs against
      # the bare `postgres:17-alpine` above with nothing added.
      #
      # WHAT WAS CONSIDERED AND MEASURED INSTEAD. Provisioning `public.strategies` here
      # so the file could use it would mean applying
      # `020_declare_pre_existing_tables.sql` FIRST (per
      # backend_app/migrations/PROVISIONING_ORDER.md -- nine files in the numbered set
      # ALTER `profiles` or `strategies`), and 020's SECTION 0 preflight
      # `RAISE EXCEPTION`s on any database lacking the `authenticated` and
      # `service_role` roles and the `auth.uid()` function, which a vanilla PostgreSQL
      # has none of. `001_strategy_architecture.sql` then needs `auth.users` and
      # `exchanges` as foreign-key referents. That is a Supabase shim plus a partial
      # replay of the numbered set -- the from-scratch provision PROVISIONING_ORDER.md
      # documents and explicitly marks as untested. Adding it here unverified would be a
      # structural claim about a job that has never run. The scratch schema makes the
      # proof independent of all of it, so the provisioning step below is unchanged.
      # `tests/test_position_delta_race_condition_fix.py` is added here because its two
      # server-backed tests now carry a `requires_postgres` skip. Before that skip they
      # were collected by the `unit-tests` lane and `test_position_update_row_level_
      # locking` failed there on every run -- `SELECT ... FOR UPDATE` is the property
      # under test and SQLite's parser rejects the clause. Skipping it out of that lane
      # without naming it here would have left the FIN-CRITICAL-002 row-locking control
      # verified by nothing, so the two changes belong together.
      # `test_concurrent_position_update_safety` is in the same file and needed a second
      # repair to be worth running: it collected every exception into a list, printed a
      # count and asserted nothing, so it passed on SQLite with all five workers failing
      # on that same syntax error. It now asserts no worker failed.
      # The file's other two tests are self-contained `Decimal` arithmetic, need no
      # server, and stay in the `unit-tests` lane.
      # `positions` comes from the provisioning step above (`d97ffff9c3bb`).
      - name: Run database-backed tests
        run: |
          pytest tests/test_database_isolation_level_postgres.py \
                 tests/test_atomic_order_cancellation_fix.py \
                 tests/test_position_delta_race_condition_fix.py \
                 tests/test_strategy_lifecycle_concurrency_postgres.py \
                 -v --tb=short \
                 --deselect tests/test_atomic_order_cancellation_fix.py::test_transaction_isolation_for_cancellation

  # ───────────────────────────────────────────────────────────────────────────────
  # WHY THIS JOB EXISTS, AND WHY IT IS SEPARATE FROM `database-tests`
  #
  # `database-tests` above runs `alembic upgrade d97ffff9c3bb` -- the branchpoint, not
  # head -- against a bare `postgres:17-alpine`, and the long comment above it explains
  # why a from-scratch provision was out of scope at the time: 020's SECTION 0 preflight
  # RAISE EXCEPTIONs on a database with no `authenticated`/`service_role` roles and no
  # `auth.uid()`, which vanilla PostgreSQL has none of. That obstacle is now gone.
  # `scripts/provision_database.py --create-substrate` creates exactly that shim, and the
  # full order it uses is documented in DATABASE_PROVISIONING_RUNBOOK.md.
  #
  # It is a separate job rather than extra steps in `database-tests` so that a failure
  # here cannot be confused with a failure of the four database-backed test files, which
  # are a different claim about a different thing.
  #
  # WHAT IT GATES. Three things that were verified by hand and by nothing automatic:
  #   1. the migration set still applies to an EMPTY database, in one command;
  #   2. the three `RAISE EXCEPTION` backstops in
  #      `migrations/hardening/999_privilege_hardening.sql` -- which abort on a
  #      per-customer table readable by `anon`, on a browser role holding TRUNCATE, and
  #      on a policy predicate that is the constant TRUE;
  #   3. the resulting schema matches `staging/provisioning_snapshot.json`, the committed
  #      baseline. Drift means either a missing migration or a stale baseline, and those
  #      have opposite fixes -- which is why a human should see it before merge.
  # Then every behavioural probe, including the two cross-tenant read sweeps that seed a
  # row owned by one customer and try to read it as another.
  #
  # WHAT HAS AND HAS NOT BEEN VERIFIED, stated because the comment above this one
  # rightly objects to unverified structural claims about jobs that have never run.
  # VERIFIED locally, repeatedly: the whole sequence against a vanilla PostgreSQL with
  # no Supabase substrate, which is the same starting condition as this container --
  # `staging/reprovision.py` passes `--create-substrate` and that is the only path used.
  # NOT VERIFIED: the PostgreSQL major version. Local runs are 16.2, from the `pgserver`
  # wheel; this container is 17 to match production's reported `server_version 17.6`.
  # The first run of this job on a pull request is what closes that gap. It is wired in
  # this state deliberately -- a provisioner verified by hand that nothing ever runs is
  # documentation, not a control.
  # ───────────────────────────────────────────────────────────────────────────────
  provisioning-and-isolation:
    name: Provisioning, Privilege Hardening & Tenant Isolation
    runs-on: ubuntu-latest
    needs: static-audit
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `DATABASE_URL` is read by `backend_app/alembic/env.py`; `AERORA_TEST_DATABASE_URL`
      # is what `tests/conftest.py` requires before it will let a DATABASE_URL survive
      # into the test process. Both are needed, for the reasons spelled out in the
      # `database-tests` env block above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AERORA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PROVISION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ENV: test
      VYOMQUANT_MODE: safe
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio psycopg2-binary

      # `--dry-run` is the provisioner's default, so `--apply` is required. The DSN is
      # localhost, so the non-localhost refusal does not trigger and
      # `--i-understand-this-is-remote` is deliberately NOT passed: if this URL ever
      # stops being loopback, this step must fail rather than proceed.
      - name: Provision the full schema from repository source
        run: |
          python scripts/provision_database.py \
            --dsn "$PROVISION_DATABASE_URL" --apply --create-substrate

      # Re-running must be safe AND must not re-grant anything. This is the regression
      # guard for the defect where a `GRANT ALL ON ALL TABLES` in the substrate re-granted
      # 787 privilege rows on the second run while the migrations' own REVOKEs were
      # correctly skipped -- leaving run 2 less secure than run 1, silently.
      - name: Provision again -- idempotency, including the privilege direction
        run: |
          python scripts/provision_database.py \
            --dsn "$PROVISION_DATABASE_URL" --apply --create-substrate

      - name: Fail on schema drift from the committed baseline
        run: python scripts/verify_schema_drift.py --dsn "$PROVISION_DATABASE_URL"

      # `if: always()` so this still runs when the step above FAILED, which is the only
      # time it is wanted. The database here was just provisioned from repository source
      # twice over, so its shape is by definition what the repository produces -- the one
      # kind of database allowed to define the baseline. No local PostgreSQL is needed to
      # refresh a stale baseline any more: download this artifact, diff it against
      # staging/provisioning_snapshot.json, and commit it if the delta is accounted for by
      # the migrations added since.
      #
      # Deliberately an ARTIFACT and not a commit. A stale baseline and a missing
      # migration produce an identical report with opposite fixes, so a job that
      # auto-refreshed the baseline would silently convert every missing migration into a
      # new expectation -- it would answer the question this check exists to ask.
      - name: Upload a refreshed baseline candidate for comparison
        if: always()
        run: |
          python scripts/verify_schema_drift.py \
            --dsn "$PROVISION_DATABASE_URL" \
            --write-baseline reports/provisioning_snapshot.candidate.json

      - name: Attach the baseline candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provisioning-snapshot-candidate
          path: reports/provisioning_snapshot.candidate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run every database security and integrity probe
        run: python staging/run_all_probes.py

      # DB-04: scripts/post_migration_validation.py existed, was tested, and was
      # correct, but nothing in CI ever actually called it -- its catalog-driven
      # privilege-hardening check (broader than 999_privilege_hardening.sql's own
      # narrower, already-wired backstop above) was written and inert. Wired in here,
      # against the same fully-provisioned real Postgres this job already set up; the
      # script also re-checks table/column/RPC existence and re-exports schema
      # metadata, none of which this session found reason to doubt when run manually
      # against a real replica with the same provisioning this job performs.
      - name: Run the catalog-driven privilege-hardening and schema validation script
        run: |
          mkdir -p reports
          python scripts/post_migration_validation.py

      - name: Run the PostgreSQL-only test lane
        run: |
          pytest tests/test_tenant_isolation_rls_postgres.py \
                 tests/test_cross_tenant_read_sweep_postgres.py \
                 tests/test_billing_data_isolation_postgres.py \
                 tests/test_tenant_referential_integrity_postgres.py \
                 tests/test_pgcrypto_preflight_postgres.py \
                 tests/test_signup_integration_postgres.py \
                 tests/test_position_lifecycle_postgres.py \
                 tests/test_referral_money_lifecycle_postgres.py \
                 tests/test_orm_models_match_provisioned_schema.py \
                 tests/test_bug049_identity_types_postgres.py \
                 tests/test_schema_drift_checker_is_read_only_postgres.py \
                 tests/test_production_security_probe_rolls_back_postgres.py \
                 -v --tb=short

      # WHY THIS STEP EXISTS.
      #
      # Both PostgreSQL jobs in this workflow name their files EXPLICITLY -- neither runs
      # `pytest tests/`. So a test file that gates itself on AERORA_TEST_DATABASE_URL and
      # is not named in one of those lists runs against a real server NOWHERE, and nothing
      # reports it:
      #
      #   * the `unit-tests` lane deliberately has no DATABASE_URL (see its own comment),
      #     so each such test SKIPS there -- and a skip is not a failure, so it is invisible
      #     in a green run; and
      #   * neither PostgreSQL lane lists the file, so the gate never opens.
      #
      # Measured against the real CI log for run 39695784610 (HEAD dfd9ca24, all 8 jobs
      # green): 49 test files gate on that variable, the two lanes above between them ran
      # 11 of them, and the remaining 35 contributed 432 SKIPPED results to that run's
      # "790 skipped" and not one assertion against PostgreSQL.
      #
      # Those 35 files are not peripheral. They include the regression test for SEC-07
      # (a P0: any signed-in user could grant themselves a paid plan and raise their own
      # limits), the cross-tenant isolation matrix, fee_records RLS, the paper-trading
      # ledger and fill-atomicity suites, concurrent-exposure and stale-execution recovery,
      # referral-commission idempotence and single-currency enforcement, and WORK-03's
      # cross-process single-owner bot lock. Every one of those is an RLS, privilege,
      # trigger, constraint or transaction-isolation guarantee that SQLite cannot express,
      # which is exactly why each file gates itself instead of asserting something weaker.
      #
      # This step runs them here, in the job that has already provisioned the full schema
      # from repository source (twice, for idempotency) and therefore has the anon /
      # authenticated / service_role substrate they need, rather than in the lighter
      # `database-tests` job which only alembic-upgrades to a pinned revision.
      #
      # It is deliberately a SEPARATE step from the lane above so that a failure here is
      # attributable on sight, and deliberately has no `continue-on-error`: these
      # assertions have never run against a real server, so whatever they find is new
      # information and must be allowed to red the pipeline rather than be absorbed.
      #
      # tests/test_every_postgres_gated_file_runs_in_a_postgres_lane.py parses this file
      # and fails if a newly added PostgreSQL-gated test file is missing from these lists,
      # so this gap cannot silently reopen.
      - name: Run every remaining PostgreSQL-gated test file
        run: |
          pytest tests/test_aud01_signal_audit_log.py \
                 tests/test_aud02_order_audit_trail_is_durable.py \
                 tests/test_bill01_razorpay_plans_expire.py \
                 tests/test_bug056_library_subscriptions_updated_at_postgres.py \
                 tests/test_bug057_listing_moderation_authz_postgres.py \
                 tests/test_d5_watchdog_adjudication_repair.py \
                 tests/test_db03_privilege_hardening_detects_untracked_tables_postgres.py \
                 tests/test_dup01_confirmation_lost_postgres.py \
                 tests/test_fee01_tenant_is_validated_not_sentinel_postgres.py \
                 tests/test_fee_third_asset_pct_is_nullable_postgres.py \
                 tests/test_json_extract_dialect_portability.py \
                 tests/test_kill03_authoritative_global_halt.py \
                 tests/test_lib01_clone_strategy_postgres.py \
                 tests/test_mkt01_entitlement_tables_postgres.py \
                 tests/test_mkt06_creator_payout_atomic_postgres.py \
                 tests/test_money01_referral_commission_idempotence_postgres.py \
                 tests/test_money04_referral_ledger_is_single_currency_postgres.py \
                 tests/test_money06_referral_obligations_postgres.py \
                 tests/test_p10d_fee_summary_does_not_mix_denominations_postgres.py \
                 tests/test_p10d_referral_settlement_lifecycle_postgres.py \
                 tests/test_p10j_probe_pg_ready_uses_shared_classification.py \
                 tests/test_paper01_botrunner_fills_reach_the_ledger_postgres.py \
                 tests/test_paper02_unfunded_order_state_postgres.py \
                 tests/test_paper03_write_service_role_only_postgres.py \
                 tests/test_paper05_apply_fill_atomic_postgres.py \
                 tests/test_paper05_lane_preserves_the_paper_schema_postgres.py \
                 tests/test_ref01_payout_atomic_postgres.py \
                 tests/test_referral_payout_schema_contract_postgres.py \
                 tests/test_sec07_profiles_platform_columns_postgres.py \
                 tests/test_sec09_marketplace_evidence_service_role_only_postgres.py \
                 tests/test_sec16_strategy_deployments_guard_postgres.py \
                 tests/test_dbalm02_identity_coverage_postgres.py \
                 tests/test_tenant01_cross_tenant_matrix_postgres.py \
                 tests/test_tenant01_restricted_payment_methods_role_postgres.py \
                 tests/test_tenant02_fee_records_rls_postgres.py \
                 tests/test_tenant_db_context_postgres.py \
                 tests/test_trade01_concurrent_exposure_postgres.py \
                 tests/test_trade07_stale_execution_recovery_postgres.py \
                 tests/test_work03_bot_ownership_claims_postgres.py \
                 -v --tb=short

      # The two gates that must pass before either production verifier is pointed at a
      # live database. They need no server of their own -- they parse the scripts -- so
      # they run here as well as in the lane above, where a missing PostgreSQL would
      # skip them and the structural guarantees would go unchecked.
      - name: Prove the production verifiers are safe to run against production
        run: |
          pytest tests/test_bug049_sql_and_alembic_agree.py \
                 tests/test_production_security_probe_rolls_back_postgres.py \
                 -v --tb=short \
                 -k "source or autocommit or finally or pooler or agree or decision or cascade or convention or backstop or explicit_step or missing"

  docker-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: static-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Automated Docker Validation
        run: python scripts/docker_validation.py

  frontend-tests:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    # Budget: re-measured for task 4.7 against the suite as it exists today, not the 53-file
    # baseline this comment used to cite. vitest.config.js's own include glob now matches 150
    # files (145 under tests/unit/, 5 under src/**/__tests__/), still run sequentially on
    # purpose (fileParallelism: false / maxWorkers: 1 -- parallel fork workers fail their
    # startup handshake on constrained hosts and whole files then silently never run).
    # Measured: the first 50 of those 150 files (`node node_modules/vitest/vitest.mjs run
    # <paths>`, this pool config) took 409s per Vitest's own reported duration (~420s
    # wall-clock including process start/stop). The other 100 files were not run in this
    # measurement pass; linearly extrapolating the measured batch across all 150 puts the
    # test step alone at roughly 20-25 minutes, before `npm ci`, ESLint, and `vite build`
    # are added ahead of it. 40 minutes no longer carries the headroom the original 53-file/
    # 14-minute estimate assumed. Raised to 60: comfortably above the ~20-25 minute
    # extrapolated test-step floor plus the preceding install/lint/build steps, while
    # remaining far short of the 360-minute default so a genuine hang still gets killed.
    # This extrapolation is not a full 150-file timing; if the ceiling is tightened further,
    # measure the remaining 100 files directly rather than tightening from this estimate.
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the base commit of the pull request is available to diff against.
          fetch-depth: 0

      # This workflow deliberately has no `paths:` filter on its trigger: adding one would
      # narrow validate-code, unit-tests and docker-check, which must keep running on every
      # pull request. The frontend path filter therefore lives inside this job. The job always
      # starts, and on a pull request that touches nothing under algo22-terminal/ every step
      # below is skipped and the job reports success in seconds -- so it is safe to mark as a
      # required check without gating backend-only changes.
      - name: Detect frontend changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # CI-01: no base/head pair on a push; the commit being deployed is always tested.
            CHANGED="push-to-default-branch"
          else
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
              'algo22-terminal' '.github/workflows/01-pr-check.yml')
          fi
          if [ -n "$CHANGED" ]; then
            echo "Frontend-relevant changes detected:"
            echo "$CHANGED"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under algo22-terminal/ — frontend build and tests skipped."
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'algo22-terminal/package-lock.json'

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npm ci

      # No workflow invoked eslint before this step, so the error count was unbounded and
      # undetected: `no-undef` is what would have caught the three `post is not defined`
      # ReferenceErrors, each of which threw before reaching the network.
      #
      # The binary is called by path, not through `npx`, deliberately: `npx` swallows stdout
      # on at least one maintainer machine, which makes a local reproduction of a CI failure
      # look like a pass.
      #
      # `--max-warnings` pins the warning count rather than driving it to zero. Errors fail
      # the job outright; the cap means the warning backlog cannot grow either. Lowering it
      # as warnings are fixed is the intent.
      #
      # THE DATED EXCEPTION IS GONE (task 9.2). Three --ignore-pattern flags used to exclude
      # `src/contexts/{Indicator,Logic,Strategy}EngineContext.jsx`, each of which held a live
      # `no-undef` on an unimported `post` -- the defect tasks 9.2 and 9.3 existed to fix.
      # Task 9.2 removed those three dead call paths, so the flags are deleted and this gate
      # now reads all of `src/` with no exclusions. Measured after that change: 0 errors.
      #
      # The cap moved 227 -> 230 in task 9.2's commit, and that was scope growth rather than
      # backlog growth: the three files entered the gate carrying three `'React' is defined
      # but never used` warnings between them -- the same warning 63 files under `src/`
      # already carry, because ESLint does not count a JSX-only reference. No new warning
      # class appeared, and the error count went from 5 to 0.
      #
      # 230 -> 226 in task 9.3's commit, which deleted `contexts/CopilotContext.jsx`,
      # `components/CopilotChat.jsx` and `hooks/useCopilotSSE.js`. Lowered in the same commit
      # rather than left with the headroom open, which is what the ratchet is for.
      - name: Lint frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: node node_modules/eslint/bin/eslint.js src --max-warnings 226

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npm run build

      # `npx vitest --run` and never `npm run test`: the `test` script is bare `vitest`, which
      # is watch mode and would never terminate on a runner. `--run` executes once and exits
      # non-zero on any failure, which is what makes this job blocking.
      # THE BUNDLE SECRET SWEEP RUNS HERE, BECAUSE THIS IS WHERE THE BUNDLE EXISTS.
      #
      # `tests/test_no_secrets_in_bundle.py` scans `algo22-terminal/dist/` for leaked secret
      # names and for JWT-shaped strings other than the expected anon key. Two of its tests
      # take the built bundle as their input, and in the `unit-tests` job they could only ever
      # ERROR -- that job installs Python and never node, so `dist/` is never built. They did
      # exactly that on the first run of that job that was ever allowed to start.
      #
      # They belong after the `npm run build` step above, which is three lines up and has just
      # produced the artifact. The job's `if:` guard is also the right scope for them: it fires
      # on changes under `algo22-terminal/**`, and nothing else can put a secret in the bundle.
      #
      # Only `pytest` is installed, not `requirements-cpu.txt`. Measured rather than assumed:
      # the module imports `pathlib`, `pytest` and `re`, and `tests/conftest.py` imports
      # `asyncio`, `os`, `pytest` and `warnings`. Nothing here needs the backend dependency set.
      - name: Set up Python for the bundle secret sweep
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan the built bundle for leaked secrets
        if: steps.changes.outputs.frontend == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest tests/test_no_secrets_in_bundle.py -m frontend_bundle -v --tb=short

      # AFTER the secret sweep, deliberately. These two steps were the other way round at
      # first, which meant a failing unit test stopped the bundle from ever being checked for
      # a leaked credential -- and that happened immediately: all 155 test files passed while
      # the step still exited non-zero on an unhandled error, so the sweep never ran. A secret
      # in a shipped bundle is the more serious of the two findings and must not be gated
      # behind the less serious one.
      - name: Run frontend unit tests
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npx vitest --run
