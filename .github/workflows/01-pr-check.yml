# 01-pr-check.yml — Pull Request Validation Pipeline
name: 01 PR Check

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.11'
  # Matches the Node version 06-frontend-deploy.yml builds the shipped bundle with, so the
  # PR gate and the deploy build agree. Read only by the frontend-tests job below; no
  # pre-existing job references it.
  NODE_VERSION: '20'

jobs:
  validate-code:
    name: Code Quality & Static Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-cpu.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install flake8 black isort mypy bandit pytest pytest-asyncio

      - name: Automated Import & AST Audit
        run: python scripts/import_audit.py backend_app

      - name: Automated Dependency Audit
        run: python scripts/dependency_audit.py

      - name: Flake8 Check
        run: flake8 backend_app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Black Format Check
        run: black --check backend_app

      - name: Isort Check
        run: isort --check-only backend_app

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: validate-code

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-cov

      # DELIBERATELY NO `DATABASE_URL` HERE, and this is load-bearing (task 13.21).
      # Without it `core/database_pool.py` falls back to `sqlite:///./algo22.db`, which is
      # what the 11,000+ tests in this lane are measured against and what they must keep
      # being measured against. The PostgreSQL service added for task 13.21 lives in its
      # own `database-tests` job below rather than here, precisely so that pointing a
      # DATABASE_URL at a real server cannot change the behaviour of this lane. Adding
      # one here would silently re-route every `SessionLocal()` in the suite.
      - name: Run Unit Tests
        run: pytest tests/ -v --tb=short -k "not chaos and not load"
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          AERORA_MODE: safe
          PYTHONPATH: .

  # ───────────────────────────────────────────────────────────────────────────────
  # production-launch-hardening task 13.21, defect B.
  #
  # WHY THIS JOB EXISTS. There was no PostgreSQL anywhere in CI -- the `unit-tests` job
  # above has a `services:` block with redis and nothing else -- so three test files that
  # need a real server through `backend_app.core.database.SessionLocal` could not run
  # anywhere, and were carried in task 13.13's inventory as environment gaps. One of them,
  # `tests/test_transaction_isolation_serializable.py`, is the test that would have caught
  # defect A: the SERIALIZABLE isolation control had never once executed, because it was
  # issued as a raw SQL string that SQLAlchemy 2.x rejects and the rejection was swallowed
  # into a `logger.warning`. A control with a test that cannot run is a control with no
  # test.
  #
  # WHY IT IS A SEPARATE JOB rather than a `DATABASE_URL` on `unit-tests`. The 11,000+
  # tests that pass today pass against SQLite. Setting DATABASE_URL on that job would
  # re-point every `SessionLocal()` in the suite at PostgreSQL in one move -- a far larger
  # change than this task, and one with no way to tell a new PostgreSQL-specific failure
  # from a regression. This job sets DATABASE_URL for the handful of files that require it
  # and nothing else.
  #
  # WHAT IT PROVISIONS, AND WHY IT STOPS WHERE IT DOES. `alembic upgrade d97ffff9c3bb`,
  # not `upgrade head`. `d97ffff9c3bb` is the branchpoint (`alembic history` confirms it)
  # and the revision whose `op.create_table('orders', ...)` the cancellation tests need;
  # the path to it from base is linear and unambiguous. `upgrade head` CANNOT provision a
  # fresh database, and that was measured rather than assumed -- see task 13.21 for the
  # transcript. The next revision on one branch, `add_foreign_keys_20260817.py`, adds
  # `FOREIGN KEY (tenant_id) REFERENCES profiles(id)`, and `profiles` has no CREATE TABLE
  # in any migration or SQL file in this repository. Its `try/except Exception` around
  # each statement does not save it: PostgreSQL aborts the whole transaction on the first
  # failed statement, so every statement after the swallow -- including alembic's own
  # `UPDATE alembic_version` -- fails with `InFailedSqlTransaction`. Also note that
  # `4ef23035a692_baseline.py`'s `upgrade()` only DROPs; its CREATE TABLEs are in
  # `downgrade()`, so the baseline alone provisions nothing.
  #
  # `postgres:17-alpine` because production reports `server_version 17.6`. Matching the
  # major version is the point; the password is a throwaway for an ephemeral service
  # container on the runner's loopback interface and is not a credential for anything.
  # ───────────────────────────────────────────────────────────────────────────────
  database-tests:
    name: Database Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: validate-code
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TWO VARIABLES, TWO CONSUMERS, AND THE SECOND ONE IS NOT REDUNDANT.
      # `DATABASE_URL` is what `backend_app/alembic/env.py` reads to set
      # `sqlalchemy.url`, so the provisioning step needs it.
      # `AERORA_TEST_DATABASE_URL` is what `tests/conftest.py` requires before it will
      # let a DATABASE_URL survive into the test process: that conftest blanks
      # DATABASE_URL at import time, deliberately, so that a `.env` placeholder cannot
      # point the suite at a real server. Until task 13.21 it blanked it
      # unconditionally, which is why these test files could not run even where a
      # database existed. Setting only DATABASE_URL here would reproduce that: alembic
      # would provision the schema and pytest would still run against SQLite.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AERORA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ENV: test
      # `VYOMQUANT_MODE` and not `AERORA_MODE`: the latter still works but
      # `core/safety_config.py` emits a deprecation warning telling callers to move.
      VYOMQUANT_MODE: safe
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio

      # `backend_app/alembic/env.py` reads DATABASE_URL from the environment and feeds it
      # to `sqlalchemy.url`, so no ini edit is needed. Stops at the branchpoint -- see the
      # block comment above for why `head` is not reachable on an empty database.
      - name: Provision schema
        run: |
          python -m alembic upgrade d97ffff9c3bb
          python -m alembic current

      # TWO FILES, AND ONE DELIBERATE OMISSION.
      #
      # `test_database_isolation_level_postgres.py` is new with task 13.21 and skips
      # itself unless DATABASE_URL names a PostgreSQL server, so it is inert in the
      # `unit-tests` lane and real here. It is the half of defect A's proof that SQLite
      # cannot give: that `SHOW transaction_isolation` actually reports `serializable`.
      #
      # `test_atomic_order_cancellation_fix.py` needs the `orders` table, which the
      # provisioning step above creates. Its fourth test,
      # `test_transaction_isolation_for_cancellation`, is deselected and NOT because it is
      # inconvenient: it asserts that the plain, general `SessionLocal()` reports
      # `serializable`. `core/database.py`'s own design says the opposite -- FINANCIAL is
      # SERIALIZABLE, GENERAL and READ_ONLY are READ COMMITTED -- and nothing outside
      # `backend/paper/paper_repository.py` retries on PostgreSQL's `40001`
      # serialization_failure, so making the shared engine SERIALIZABLE would turn a
      # dormant control into live `could not serialize access` errors. The assertion is
      # left exactly as written and the conflict is recorded in task 13.21 as an open
      # decision. It is not relaxed, and it is not quietly passing either.
      #
      # `tests/test_transaction_isolation_serializable.py` is not selected for the same
      # reason: all three of its tests make that same global-SERIALIZABLE assertion. The
      # environment gap task 13.13 recorded for it is closed -- a PostgreSQL now exists in
      # this job and the file can be invoked against it by hand -- but the design conflict
      # is not, and resolving it is not this task's call. Task 13.21 names it.
      - name: Run database-backed tests
        run: |
          pytest tests/test_database_isolation_level_postgres.py \
                 tests/test_atomic_order_cancellation_fix.py \
                 -v --tb=short \
                 --deselect tests/test_atomic_order_cancellation_fix.py::test_transaction_isolation_for_cancellation

  docker-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: validate-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Automated Docker Validation
        run: python scripts/docker_validation.py

  frontend-tests:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    # Budget: re-measured for task 4.7 against the suite as it exists today, not the 53-file
    # baseline this comment used to cite. vitest.config.js's own include glob now matches 150
    # files (145 under tests/unit/, 5 under src/**/__tests__/), still run sequentially on
    # purpose (fileParallelism: false / maxWorkers: 1 -- parallel fork workers fail their
    # startup handshake on constrained hosts and whole files then silently never run).
    # Measured: the first 50 of those 150 files (`node node_modules/vitest/vitest.mjs run
    # <paths>`, this pool config) took 409s per Vitest's own reported duration (~420s
    # wall-clock including process start/stop). The other 100 files were not run in this
    # measurement pass; linearly extrapolating the measured batch across all 150 puts the
    # test step alone at roughly 20-25 minutes, before `npm ci`, ESLint, and `vite build`
    # are added ahead of it. 40 minutes no longer carries the headroom the original 53-file/
    # 14-minute estimate assumed. Raised to 60: comfortably above the ~20-25 minute
    # extrapolated test-step floor plus the preceding install/lint/build steps, while
    # remaining far short of the 360-minute default so a genuine hang still gets killed.
    # This extrapolation is not a full 150-file timing; if the ceiling is tightened further,
    # measure the remaining 100 files directly rather than tightening from this estimate.
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the base commit of the pull request is available to diff against.
          fetch-depth: 0

      # This workflow deliberately has no `paths:` filter on its trigger: adding one would
      # narrow validate-code, unit-tests and docker-check, which must keep running on every
      # pull request. The frontend path filter therefore lives inside this job. The job always
      # starts, and on a pull request that touches nothing under algo22-terminal/ every step
      # below is skipped and the job reports success in seconds -- so it is safe to mark as a
      # required check without gating backend-only changes.
      - name: Detect frontend changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'algo22-terminal' '.github/workflows/01-pr-check.yml')
          if [ -n "$CHANGED" ]; then
            echo "Frontend-relevant changes detected:"
            echo "$CHANGED"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under algo22-terminal/ — frontend build and tests skipped."
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'algo22-terminal/package-lock.json'

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npm ci

      # No workflow invoked eslint before this step, so the error count was unbounded and
      # undetected: `no-undef` is what would have caught the three `post is not defined`
      # ReferenceErrors, each of which threw before reaching the network.
      #
      # The binary is called by path, not through `npx`, deliberately: `npx` swallows stdout
      # on at least one maintainer machine, which makes a local reproduction of a CI failure
      # look like a pass.
      #
      # `--max-warnings` pins the warning count rather than driving it to zero. Errors fail
      # the job outright; the cap means the warning backlog cannot grow either. Lowering it
      # as warnings are fixed is the intent.
      #
      # THE DATED EXCEPTION IS GONE (task 9.2). Three --ignore-pattern flags used to exclude
      # `src/contexts/{Indicator,Logic,Strategy}EngineContext.jsx`, each of which held a live
      # `no-undef` on an unimported `post` -- the defect tasks 9.2 and 9.3 existed to fix.
      # Task 9.2 removed those three dead call paths, so the flags are deleted and this gate
      # now reads all of `src/` with no exclusions. Measured after that change: 0 errors.
      #
      # The cap moved 227 -> 230 in task 9.2's commit, and that was scope growth rather than
      # backlog growth: the three files entered the gate carrying three `'React' is defined
      # but never used` warnings between them -- the same warning 63 files under `src/`
      # already carry, because ESLint does not count a JSX-only reference. No new warning
      # class appeared, and the error count went from 5 to 0.
      #
      # 230 -> 226 in task 9.3's commit, which deleted `contexts/CopilotContext.jsx`,
      # `components/CopilotChat.jsx` and `hooks/useCopilotSSE.js`. Lowered in the same commit
      # rather than left with the headroom open, which is what the ratchet is for.
      - name: Lint frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: node node_modules/eslint/bin/eslint.js src --max-warnings 226

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npm run build

      # `npx vitest --run` and never `npm run test`: the `test` script is bare `vitest`, which
      # is watch mode and would never terminate on a runner. `--run` executes once and exits
      # non-zero on any failure, which is what makes this job blocking.
      - name: Run frontend unit tests
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npx vitest --run
