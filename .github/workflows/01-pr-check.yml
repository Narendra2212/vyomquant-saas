# 01-pr-check.yml — Pull Request Validation Pipeline
name: 01 PR Check

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.11'

jobs:
  validate-code:
    name: Code Quality & Static Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i 's/^torch==.*/torch==2.3.1+cpu/' requirements.txt
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install flake8 black isort mypy bandit pytest

      - name: Automated Import & AST Audit
        run: python scripts/import_audit.py backend_app

      - name: Automated Dependency Audit
        run: python scripts/dependency_audit.py

      - name: Flake8 Check
        run: flake8 backend_app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Black Format Check
        run: black --check backend_app

      - name: Isort Check
        run: isort --check-only backend_app

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: validate-code

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i 's/^torch==.*/torch==2.3.1+cpu/' requirements.txt
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov

      - name: Run Unit Tests
        run: pytest tests/ -v --tb=short -k "not chaos and not load"
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          AERORA_MODE: safe
          PYTHONPATH: .

  docker-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: validate-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Automated Docker Validation
        run: python scripts/docker_validation.py
