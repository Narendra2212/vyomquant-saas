# 01-pr-check.yml — Pull Request Validation Pipeline
name: 01 PR Check

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.11'
  # Matches the Node version 06-frontend-deploy.yml builds the shipped bundle with, so the
  # PR gate and the deploy build agree. Read only by the frontend-tests job below; no
  # pre-existing job references it.
  NODE_VERSION: '20'

jobs:
  validate-code:
    name: Code Quality & Static Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-cpu.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install flake8 black isort mypy bandit pytest pytest-asyncio

      - name: Automated Import & AST Audit
        run: python scripts/import_audit.py backend_app

      - name: Automated Dependency Audit
        run: python scripts/dependency_audit.py

      - name: Flake8 Check
        run: flake8 backend_app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Black Format Check
        run: black --check backend_app

      - name: Isort Check
        run: isort --check-only backend_app

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: validate-code

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements-cpu.txt
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Unit Tests
        run: pytest tests/ -v --tb=short -k "not chaos and not load"
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          AERORA_MODE: safe
          PYTHONPATH: .

  docker-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: validate-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Automated Docker Validation
        run: python scripts/docker_validation.py

  frontend-tests:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    # Budget: the suite runs its 53 files sequentially on purpose (vitest.config.js sets
    # fileParallelism: false / maxWorkers: 1, because parallel forks workers fail their
    # startup handshake on constrained hosts and whole files then silently never run), which
    # costs roughly 14 minutes of wall clock. Add `npm ci` on a cold cache and `vite build`
    # and an observed run is about 20 minutes. 40 gives ~2x headroom for a slow runner while
    # still killing a genuine hang far short of the 360-minute default.
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the base commit of the pull request is available to diff against.
          fetch-depth: 0

      # This workflow deliberately has no `paths:` filter on its trigger: adding one would
      # narrow validate-code, unit-tests and docker-check, which must keep running on every
      # pull request. The frontend path filter therefore lives inside this job. The job always
      # starts, and on a pull request that touches nothing under algo22-terminal/ every step
      # below is skipped and the job reports success in seconds -- so it is safe to mark as a
      # required check without gating backend-only changes.
      - name: Detect frontend changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'algo22-terminal' '.github/workflows/01-pr-check.yml')
          if [ -n "$CHANGED" ]; then
            echo "Frontend-relevant changes detected:"
            echo "$CHANGED"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under algo22-terminal/ — frontend build and tests skipped."
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'algo22-terminal/package-lock.json'

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npm ci

      # No workflow invoked eslint before this step, so the error count was unbounded and
      # undetected: `no-undef` is what would have caught the three `post is not defined`
      # ReferenceErrors, each of which threw before reaching the network.
      #
      # The binary is called by path, not through `npx`, deliberately: `npx` swallows stdout
      # on at least one maintainer machine, which makes a local reproduction of a CI failure
      # look like a pass.
      #
      # `--max-warnings 227` pins the warnings at their count on 2026-09-20 rather than
      # driving them to zero. Errors fail the job outright; the cap means the warning
      # backlog cannot grow either. Lowering it as warnings are fixed is the intent.
      #
      # DATED EXCEPTION -- 2026-09-20. The three engine contexts are excluded because each
      # holds a live `no-undef` on `post`, which is the defect tasks 9.2 and 9.3 exist to
      # fix. They are excluded so this gate can go in now and start catching new errors,
      # instead of waiting on another task. Delete the three --ignore-pattern flags as part
      # of 9.2/9.3; the gate is incomplete until they are gone.
      - name: Lint frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: |
          node node_modules/eslint/bin/eslint.js src \
            --ignore-pattern 'src/contexts/IndicatorEngineContext.jsx' \
            --ignore-pattern 'src/contexts/LogicEngineContext.jsx' \
            --ignore-pattern 'src/contexts/StrategyEngineContext.jsx' \
            --max-warnings 227

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npm run build

      # `npx vitest --run` and never `npm run test`: the `test` script is bare `vitest`, which
      # is watch mode and would never terminate on a runner. `--run` executes once and exits
      # non-zero on any failure, which is what makes this job blocking.
      - name: Run frontend unit tests
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./algo22-terminal
        run: npx vitest --run
