# 03-deploy.yml — Production Automated Deployment & Self-Healing Pipeline
name: 03 Deploy

on:
  workflow_run:
    workflows: ["02 Build"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECS_CLUSTER: vyomquant-cluster
  ECS_SERVICE: vyomquant-api-service-cjema2sl
  PYTHON_VERSION: '3.11'

jobs:
  pre-deployment-validation:
    name: Pre-Deployment Validation Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i 's/^torch==.*/torch==2.3.1+cpu/' requirements.txt
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Execute Pre-Deployment Validation Engine
        run: python scripts/pre_deployment_validation.py

  ecs-deployment:
    name: ECS Fargate Deploy & Self-Healing Diagnostics
    runs-on: ubuntu-latest
    needs: pre-deployment-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Execute Automated Deployment & Self-Healing Diagnostic Engine
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: python scripts/ecs_deploy_and_diagnose.py

      - name: Generate Reports
        if: always()
        run: python scripts/generate_reports.py

      - name: Upload Deployment & Diagnostic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-reports
          path: |
            *.md
            reports/
