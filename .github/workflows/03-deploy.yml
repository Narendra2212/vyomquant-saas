# 03-deploy.yml — Production Automated Deployment & Self-Healing Pipeline
name: 03 Deploy

on:
  workflow_run:
    workflows: ["02 Build"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      allow_unscanned:
        description: >-
          Deploy a commit that has no 05 Security run. Only for dispatching an older
          commit; a missing scan is otherwise treated as a failed gate.
        type: boolean
        default: false

# Only ONE deployment may touch the ECS service at a time.
#
# Without this, two runs (e.g. commits 429fa5c and 68b0185, pushed 99s apart on
# 2026-09-29) deploy concurrently. Each `ecs update-service` resets the other's
# in-flight rollout, so neither can ever reach steady state, both time out, and
# both fire a rollback that clobbers the other — reported as
# "DEPLOYMENT FAILED + ROLLBACK FAILED" even though every task was HEALTHY.
#
# cancel-in-progress is deliberately FALSE: a half-finished ECS rollout must be
# allowed to settle. Runs queue and deploy in order instead of racing.
concurrency:
  group: ecs-deploy-vyomquant-api-service-cjema2sl
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECS_CLUSTER: vyomquant-cluster
  ECS_SERVICE: vyomquant-api-service-cjema2sl
  PYTHON_VERSION: '3.11'

jobs:
  pre-deployment-validation:
    name: Pre-Deployment Validation Gate
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # THE SECURITY SCAN NOW GATES THE DEPLOY.
      #
      # This workflow chains off 02 Build, and 05 Security gated nothing, so a commit whose
      # Trivy scan found a CRITICAL vulnerability still shipped. PyJWT 2.13.0 - a
      # key-confusion signature bypass that lets an attacker forge tokens - reached
      # production exactly that way and stayed until the pin was bumped.
      #
      # The threshold is inherited, not invented: 05-security.yml already runs Trivy with
      # severity CRITICAL and exit-code 1, so CRITICAL blocks while HIGH and below report
      # without blocking. Gating on every severity would let a new CVE in some transitive
      # package freeze an unrelated hotfix.
      - name: Require the security scan to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ALLOW_UNSCANNED: ${{ inputs.allow_unscanned }}
        run: python scripts/require_security_scan.py

      - name: Free Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-cpu.txt'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt

      - name: Execute Pre-Deployment Validation Engine
        run: python scripts/pre_deployment_validation.py

  ecs-deployment:
    name: ECS Fargate Deploy & Self-Healing Diagnostics
    runs-on: ubuntu-latest
    needs: pre-deployment-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-cpu.txt'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR Immutable Artifact Exists for Commit SHA
        env:
          ECR_REPOSITORY: vyomquant-api
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "=== Verifying ECR Image for Commit SHA: $IMAGE_TAG ==="
          DIGEST=$(aws ecr describe-images --repository-name $ECR_REPOSITORY --image-ids imageTag=$IMAGE_TAG --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "❌ CRITICAL: No ECR image artifact found for commit SHA: $IMAGE_TAG"
            echo "Deployment FAIL-CLOSED: Refusing to deploy untested or missing build artifact."
            exit 1
          fi
          echo "✅ Verified ECR Image Artifact: $ECR_REPOSITORY:$IMAGE_TAG (Digest: $DIGEST)"

      - name: Execute Automated Deployment & Self-Healing Diagnostic Engine
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python scripts/ecs_deploy_and_diagnose.py

      - name: Generate Reports
        if: always()
        run: python scripts/generate_reports.py

      - name: Upload Deployment & Diagnostic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-reports
          path: |
            *.md
            reports/
