# 05-security.yml — Security & Vulnerability Scanning Pipeline
name: 05 Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC

env:
  PYTHON_VERSION: '3.11'

jobs:
  sast-scan:
    name: Bandit SAST & Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security scanners
        run: pip install bandit safety

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Bandit Scan
        run: bandit -r backend_app -ll -f json -o reports/bandit-report.json

      - name: Run Safety Check
        run: safety check --json --output reports/safety-report.json || echo "Safety advisory logged"

      - name: Upload Security Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-reports
          path: reports/

  container-security:
    name: Trivy Container Vulnerability Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free Disk Space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Build Docker image for scanning
        run: docker build -t trading-platform:scan -f Dockerfile .

      # Pinned to a release tag. This was `@master`, a mutable ref: whatever that branch
      # pointed at ran here with access to the job. In February 2026 the Trivy project's
      # own repository was compromised through a `pull_request_target` workflow and a
      # privileged token was extracted, so "the upstream of my CI scanner is a trusted
      # input" is not an assumption this pipeline should make. A tag can still be moved,
      # but it is not rewritten on every upstream merge.
      #
      # NOTE ON FIRST RUN: this pins a specific Trivy version where the job previously
      # tracked master, so the vulnerability database and check set may differ from the
      # last green run. The gate is unchanged (CRITICAL, exit-code 1); if it fails, read
      # it as a finding to triage rather than as a regression from this pin.
      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'trading-platform:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  # ════════════════════════════════════════════════════════════════════════════════════
  #  SC-29: INFRASTRUCTURE-AS-CODE SCANNING
  # ════════════════════════════════════════════════════════════════════════════════════
  #
  # Nothing in this repository inspected Terraform. bandit reads Python, safety and
  # pip-audit read dependency manifests, Trivy above reads the container image — and the
  # ~20 `.tf` files that declare the VPC, the ALB, the IAM roles, the security groups and
  # the secrets went unexamined by any of them. A security review found a weak ALB TLS
  # policy, a plaintext listener reachable in production, a wildcard `kms:Decrypt`
  # resource and local Terraform state in that gap; every one of those is a check a
  # scanner already ships.
  #
  # THRESHOLD: CRITICAL blocks, HIGH and below report. That is not a new convention — it
  # is the one `03-deploy.yml` already documents for the container scan and the one the
  # job above uses. Gating a brand-new scanner on HIGH would fail the pipeline on its
  # first run over pre-existing findings, which trains people to bypass it.
  #
  # SCOPE: the IaC directories only, not the repository. A repo-wide secret scan trips on
  # the deliberate fixtures in `tests/` (`test_credential_vault_strength.py` carries a
  # fake EC private key, `test_log_redaction.py` a PEM header), and a scanner that cries
  # wolf on its first run is a scanner someone disables. Repo-wide and git-history secret
  # scanning is worth adding, but it needs an ignore file written first.
  iac-scan:
    name: Trivy IaC Misconfiguration & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create reports directory
        run: mkdir -p reports

      # The gate. CRITICAL only, so it blocks on something that is unambiguously wrong.
      # CI-05: trivyignores points at the one explicit, reviewed exception this scan
      # carries (terraform/.trivyignore, AWS-0104 on aws_security_group.ecs_tasks' egress
      # only -- the other three security groups this same check used to flag are fixed for
      # real in source, not ignored). NOT verified against a real trivy binary in this
      # sandbox (same limitation this entry's own ledger note names) -- review on this
      # workflow's first real run after this change.
      - name: Trivy IaC scan — terraform/ (blocking, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'terraform'
          scanners: 'misconfig,secret'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          trivyignores: 'terraform/.trivyignore'
          hide-progress: true

      # CI-06 follow-up: this step used to scan 'aerora_quant_platform/infrastructure'.
      # That path is listed in .gitignore (line 242) -- it is deliberately never committed
      # to this repository, so a CI runner's checkout can structurally never contain it,
      # regardless of any fix on either side. It has never appeared anywhere in this
      # repository's git history either (`git log --all -- aerora_quant_platform/
      # infrastructure` returns nothing). It sat conclusion=skipped behind the terraform/
      # scan's own perpetual failure for this entire remediation effort, so nobody ever
      # saw it actually run -- the moment the terraform/ scan above first succeeded for
      # real (this session), this step ran for the first time ever and failed immediately
      # with `lstat ...: no such file or directory`, not a real misconfiguration. This
      # job's own header comment (above) frames its entire scope as the ~20 .tf files
      # under terraform/ -- there was never a second real, scannable IaC directory this
      # step could have covered from CI. Removed rather than left permanently failing on
      # a path no CI checkout can ever contain.

      # The report. Everything down to MEDIUM, non-blocking, kept as an artifact so the
      # backlog is visible and can be ratcheted down rather than discovered later.
      - name: Trivy IaC report — all severities to MEDIUM (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'terraform'
          scanners: 'misconfig,secret'
          format: 'json'
          output: 'reports/trivy-iac-report.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          hide-progress: true

      - name: Upload IaC Scan Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: iac-scan-report
          path: reports/

  # ════════════════════════════════════════════════════════════════════════════════════
  #  CI-04: FULL-TREE SECRET SCAN
  # ════════════════════════════════════════════════════════════════════════════════════
  #
  # iac-scan above only ever pointed its `secret` scanner at terraform/ and (historically;
  # see that job's own CI-06-follow-up comment for why the latter was removed)
  # aerora_quant_platform/infrastructure/ -- that job's own SC-29 comment explains why a
  # repo-wide scan was deferred: deliberate fake-credential fixtures live under tests/ (a
  # fake EC private key, a PEM header, fake Stripe/Razorpay test keys, ...), and a scanner
  # that cries wolf on day one over its own test suite is a scanner someone disables. That
  # comment named the fix too: "it needs an ignore file written first."
  #
  # Grepped the whole tree for the patterns Trivy's secret scanner itself looks for (PEM
  # BEGIN markers, AKIA.../sk_test_/sk_live_-shaped strings) instead of guessing at which
  # files need excluding: exactly 11 files, all under tests/, none in backend_app/ or
  # scripts/. `skip-files` names those 11 specifically rather than excluding all of
  # tests/, so a new test file added later -- including one that accidentally pastes in a
  # real credential -- stays covered by default.
  secret-scan-repo-wide:
    name: Trivy Secret Scan — whole repository (blocking, CRITICAL/HIGH)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy secret scan — repository-wide except known fixture files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          skip-files: 'tests/test_credential_vault_strength.py,tests/test_billing_payment_surface_refusals.py,tests/test_model_versioning.py,tests/test_env03_placeholder_secrets_are_invalid.py,tests/test_validation_sweep.py,tests/test_log_redaction.py,tests/test_marketplace_checkout_regression.py,tests/test_training_status.py,tests/test_billing_e2e.py,tests/test_credential_vault_key.py,tests/test_bill05_cancel_tells_stripe.py'
          hide-progress: true

  # ════════════════════════════════════════════════════════════════════════════════════
  #  CI-04 / DEP-01: BLOCKING DEPENDENCY AUDIT
  # ════════════════════════════════════════════════════════════════════════════════════
  #
  # Both pip-audit and npm audit already ran in 04-nightly-audit.yml -- but only on the
  # 02:00 UTC nightly cron (never on push or pull_request, so a vulnerable dependency
  # merged at any other hour waits up to a day to be reported at all) and both with
  # `continue-on-error: true` (so even the nightly run never actually blocked anything --
  # every finding landed in an uploaded JSON artifact nobody is forced to open). This job
  # runs on every push/PR this workflow already triggers on and fails the build.
  #
  # pip-audit has no built-in severity filter (unlike Trivy's `severity:` input above), so
  # the gate here is "block on every advisory pip-audit finds a fix for, except this
  # explicit, reviewed ignore list" rather than a severity threshold -- the same
  # ratchet-from-a-known-baseline shape as the IaC scan above, just expressed as
  # --ignore-vuln instead of a severity floor. Each ignored ID is DEP-01's own
  # already-investigated, currently-irreducible residual (ledger: docs/launch_readiness/
  # REMEDIATION_LEDGER.json), re-confirmed this session by actually running pip-audit
  # against this session's installed venv rather than carried forward from memory:
  #   PYSEC-2026-3447 - setuptools; the fix (83.0.0) removes pkg_resources and breaks
  #     `import razorpay` (see requirements-base.txt's own comment on that pin).
  #   PYSEC-2026-1805 - protobuf; pulled in transitively by tensorflow/opentelemetry-proto,
  #     whose current pins cap it below the fixed version.
  # A new advisory outside this list fails the job; removing an entry here (because it was
  # actually fixed) should happen in the same commit that bumps the pin, as DEP-01's
  # python-dotenv fix (PYSEC-2026-2270, closed) did this session.
  #
  # STALE IGNORES REMOVED (DEP-01): PYSEC-2026-161/248/249/2280/2281 (starlette) were
  # still listed here long after commit 0bdd78f bumped the pin to starlette==1.3.1, which
  # fixes all five -- exactly the case the paragraph above says should be cleaned up in
  # the bump commit, and was not. Verified before removal by querying the SAME service
  # pip-audit uses by default (PyPI's per-release `vulnerabilities` array,
  # https://pypi.org/pypi/starlette/1.3.1/json): starlette==1.3.1 reports ZERO advisories,
  # and fastapi==0.135.0 likewise. This matches pip-audit's own run output on main, which
  # reported "4 ignored" against seven --ignore-vuln flags -- the four being setuptools and
  # protobuf, each matched twice (its PYSEC id and the GHSA alias of the same advisory).
  # A stale ignore is not harmless: it is a standing instruction to say nothing about an
  # advisory id, and it hides the fact that the pin it was written for already moved.
  #
  # ─────────────────────────────────────────────────────────────────────────────────────
  # THE BLIND SPOT THIS JOB CARRIED, AND THE STEP THAT NOW CLOSES IT (DEP-01)
  #
  # pip-audit audits the INSTALLED environment by resolving each distribution against
  # PyPI. A pin with a PEP 440 local version segment -- `torch==2.3.1+cpu`, installed from
  # download.pytorch.org -- does not exist on PyPI under that exact version. pip-audit
  # does not fail on that. It prints a skip and exits 0. The real output of this job on
  # main was:
  #
  #     No known vulnerabilities found, 4 ignored
  #     Name  Skip Reason
  #     ----- -------------------------------------------------------------------------
  #     torch Dependency not found on PyPI and could not be audited: torch (2.3.1+cpu)
  #
  # So the headline read "No known vulnerabilities found" while the largest single source
  # of advisories in the manifest was never examined. Queried directly against pip-audit's
  # own default service, torch==2.3.1 carried 23 advisories -- including
  # GHSA-53q9-r3pm-6pq6 / CVE-2025-32434, CRITICAL, remote code execution via torch.load.
  #
  # Two changes, together: the pin moved to 2.10.0 (the cut point clearing every CRITICAL,
  # HIGH and MODERATE advisory) in all four places it is written -- requirements.txt,
  # requirements-cpu.txt, backend_app/requirements.txt and the Dockerfile's own
  # pre-install layer -- and the step below audits local-version pins explicitly, so this
  # class of silent skip cannot recur. `--strict` was considered and rejected: it fails on
  # ANY skip, which would red the build for as long as a `+cpu` pin exists instead of
  # auditing the pin.
  # ─────────────────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Blocking Dependency Vulnerability Audit (pip-audit + npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-cpu.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (blocking)
        run: |
          pip-audit \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln PYSEC-2026-1805

      # Closes the silent-skip blind spot documented above. Audits the base version of
      # every local-version pin (which the step above can only skip), and fails on any
      # advisory not accepted by name, with a reason, in the script's own IGNORED map.
      - name: Audit local-version pins pip-audit cannot resolve (blocking)
        run: python scripts/audit_local_version_pins.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'algo22-terminal/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd algo22-terminal
          npm ci

      - name: Run npm audit (blocking, HIGH and above)
        run: |
          cd algo22-terminal
          npm audit --audit-level=high --omit=dev
