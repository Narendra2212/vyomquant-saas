# STEP 8.9: PR Checks - Validate Pull Requests
#
# Runs on every PR to ensure code quality before merge

name: PR Checks

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================================================
  # STEP 8.9: Code Quality Checks
  # =============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy bandit
      
      - name: Run Flake8
        run: |
          flake8 backend_app --count --show-source --statistics
      
      - name: Run Black check
        run: |
          black --check backend_app
      
      - name: Run isort check
        run: |
          isort --check-only backend_app
      
      - name: Run MyPy
        run: |
          mypy backend_app --ignore-missing-imports
      
      - name: Run Bandit security scan
        run: |
          bandit -r backend_app -f json -ll

  # =============================================================================
  # STEP 8.9: Test Suite
  # =============================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i 's/^torch==.*/torch==2.3.1+cpu/' requirements.txt
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest || true
      
      - name: Run unit tests
        run: pytest tests/ -v --tb=short -k "not chaos and not load"
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          PYTHONPATH: .
      
      - name: Run integration tests
        run: pytest tests/ -v --tb=short -k "not chaos and not load"
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          PYTHONPATH: .

  # =============================================================================
  # STEP 8.9: Build Verification
  # =============================================================================
  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: trading-platform:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm trading-platform:test python --version
          docker run --rm trading-platform:test pip list
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: trading-platform:test
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # =============================================================================
  # STEP 8.9: Documentation Check
  # =============================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check README
        run: |
          if [ ! -f README.md ]; then
            echo "README.md is missing!"
            exit 1
          fi
      
      - name: Check API documentation
        run: |
          # Import canonical backend to generate OpenAPI spec
          pip install -r requirements.txt
          PYTHONPATH=. python -c "from backend_app.main import app; from fastapi.openapi.utils import get_openapi; import json; print(json.dumps(get_openapi(title='Aerora Quant API', version='1.0.0', routes=app.routes), indent=2))" > openapi.json || echo 'OpenAPI export skipped (needs full env)'

  # =============================================================================
  # STEP 8.9: Summary
  # =============================================================================
  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, test, build-check, docs]
    if: always()
    
    steps:
      - name: PR Summary
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY
