name: Deploy VyomQuant API to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "273709947018"
  ECR_REPOSITORY: vyomquant-api
  ECS_CLUSTER: vyomquant-cluster
  ECS_SERVICE: vyomquant-api-service-cjema2sl
  TASK_DEFINITION_FAMILY: vyomquant-api
  CONTAINER_NAME: vyomquant-api

jobs:
  build-and-deploy:
    name: Build, Push to ECR, Deploy to ECS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ─────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────
      # 2. Configure AWS credentials
      # ─────────────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─────────────────────────────────────────────────────────────────
      # 3. Login to Amazon ECR
      # ─────────────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ─────────────────────────────────────────────────────────────────
      # 4. Build, tag and push image to ECR
      #    Uses root Dockerfile (multi-stage, startup.sh, non-root user)
      # ─────────────────────────────────────────────────────────────────
      - name: Build, tag and push API image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "=== Building Docker image ==="
          docker build -f Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "=== Pushing image to ECR ==="
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_latest=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT
          echo "=== Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ==="

      # ─────────────────────────────────────────────────────────────────
      # 5. Verify secrets exist in Secrets Manager (Phase 6)
      # ─────────────────────────────────────────────────────────────────
      - name: Verify required secrets exist in AWS Secrets Manager
        run: |
          echo "=== Verifying Secrets Manager secrets ==="
          REQUIRED_SECRETS=(
            "/vyomquant/production/SUPABASE_SERVICE_ROLE_KEY"
            "/vyomquant/production/SUPABASE_ANON_KEY"
            "/vyomquant/production/SUPABASE_JWT_SECRET"
            "/vyomquant/production/DATABASE_URL"
            "/vyomquant/production/MASTER_ENCRYPTION_KEYS"
            "/vyomquant/production/JWT_SECRET"
          )
          ALL_OK=true
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if aws secretsmanager describe-secret --secret-id "$secret" --region $AWS_REGION --query 'Name' --output text 2>/dev/null; then
              echo "  ✅ EXISTS: $secret"
            else
              echo "  ❌ MISSING: $secret"
              ALL_OK=false
            fi
          done
          if [ "$ALL_OK" = false ]; then
            echo "ERROR: One or more required secrets are missing. Run ecs-secrets-manager-setup.sh first."
            exit 1
          fi
          echo "=== All required secrets verified ==="

      # ─────────────────────────────────────────────────────────────────
      # 6. Prepare task definition — fetch from AWS or bootstrap from file
      # ─────────────────────────────────────────────────────────────────
      - name: Prepare ECS task definition
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "=== Fetching/preparing task definition ==="
          # Try to fetch the current task definition from AWS
          if aws ecs describe-task-definition \
              --task-definition $TASK_DEFINITION_FAMILY \
              --region $AWS_REGION \
              --query taskDefinition \
              --output json > task-definition-current.json 2>/dev/null; then
            echo "✅ Fetched existing task definition from AWS"
            python3 -c "
          import json,sys
          with open('task-definition-current.json') as f:
              td=json.load(f)
          print(f'Family: {td[\"family\"]} Rev: {td[\"revision\"]} Image: {td[\"containerDefinitions\"][0][\"image\"]}')
          "
          else
            echo "⚠️  No existing task definition found — bootstrapping from ecs-task-definition-full.json"
            # Fill in SUPABASE_URL from GitHub Secret
            python3 -c "
          import json, os
          with open('ecs-task-definition-full.json') as f:
              td = json.load(f)
          # Replace SUPABASE_URL placeholder
          for env_var in td['containerDefinitions'][0]['environment']:
              if env_var['name'] == 'SUPABASE_URL':
                  supabase_url = os.environ.get('SUPABASE_URL', '')
                  if supabase_url:
                      env_var['value'] = supabase_url
                      print(f'Updated SUPABASE_URL to: {supabase_url}')
                  else:
                      print('WARNING: SUPABASE_URL secret not set in GitHub — using placeholder')
          # Strip fields not accepted by register-task-definition
          for key in ['taskDefinitionArn','revision','status','requiresAttributes',
                      'compatibilities','registeredAt','registeredBy','deregisteredAt']:
              td.pop(key, None)
          with open('task-definition-current.json', 'w') as f:
              json.dump(td, f, indent=2)
          print('Task definition prepared from local file.')
          "
            # Register this as the initial task definition
            aws ecs register-task-definition \
              --cli-input-json file://task-definition-current.json \
              --region $AWS_REGION
            echo "✅ Initial task definition registered"
            # Re-fetch after registration
            aws ecs describe-task-definition \
              --task-definition $TASK_DEFINITION_FAMILY \
              --region $AWS_REGION \
              --query taskDefinition \
              --output json > task-definition-current.json
          fi

      # ─────────────────────────────────────────────────────────────────
      # 7. Update task definition with new image
      # ─────────────────────────────────────────────────────────────────
      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-current.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # ─────────────────────────────────────────────────────────────────
      # 8. Register and deploy new task definition to ECS service
      # ─────────────────────────────────────────────────────────────────
      - name: Deploy to ECS service
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ─────────────────────────────────────────────────────────────────
      # 9. Verify deployment and CloudWatch logs (Phase 8)
      # ─────────────────────────────────────────────────────────────────
      - name: Verify deployment status
        run: |
          echo "=== Verifying ECS deployment ==="
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Pending:pendingCount,TaskDef:taskDefinition}' \
            --output table

          echo ""
          echo "=== Latest task definition ==="
          LATEST_TASK_DEF=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "Active task definition: $LATEST_TASK_DEF"

          echo ""
          echo "=== CloudWatch Logs (last 50 events) ==="
          LOG_GROUP="/ecs/vyomquant-api"
          # Get the latest log stream
          LATEST_STREAM=$(aws logs describe-log-streams \
            --log-group-name $LOG_GROUP \
            --order-by LastEventTime \
            --descending \
            --max-items 1 \
            --region $AWS_REGION \
            --query 'logStreams[0].logStreamName' \
            --output text 2>/dev/null || echo "NONE")

          if [ "$LATEST_STREAM" != "NONE" ] && [ "$LATEST_STREAM" != "None" ]; then
            echo "Log stream: $LATEST_STREAM"
            aws logs get-log-events \
              --log-group-name $LOG_GROUP \
              --log-stream-name "$LATEST_STREAM" \
              --limit 50 \
              --region $AWS_REGION \
              --query 'events[*].message' \
              --output text 2>/dev/null || echo "Could not fetch logs yet"
          else
            echo "No log streams found yet (container may still be starting)"
          fi

      # ─────────────────────────────────────────────────────────────────
      # 10. Print deployment summary
      # ─────────────────────────────────────────────────────────────────
      - name: Print deployment summary
        if: always()
        run: |
          echo ""
          echo "================================================================"
          echo " VYOMQUANT ECS DEPLOYMENT SUMMARY"
          echo "================================================================"
          echo " Git Commit:     ${{ github.sha }}"
          echo " ECR Image:      ${{ steps.build-image.outputs.image }}"
          echo " ECR Latest:     ${{ steps.build-image.outputs.image_latest }}"
          echo " ECS Cluster:    $ECS_CLUSTER"
          echo " ECS Service:    $ECS_SERVICE"
          echo " Task Family:    $TASK_DEFINITION_FAMILY"
          echo " Region:         $AWS_REGION"
          echo "================================================================"
