# 06-frontend-deploy.yml — Frontend Static Assets Deployment to S3 + CloudFront
name: 06 Frontend Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'algo22-terminal/**'
      - '.github/workflows/06-frontend-deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: vyomquant-frontend
  CLOUDFRONT_DISTRIBUTION_ID: EE0XECPHQ8SR0
  NODE_VERSION: '20'

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: DIAGNOSTIC 1 — AWS Identity
        run: |
          echo "=== AWS Account Identity ==="
          aws sts get-caller-identity

      - name: DIAGNOSTIC 2 — Verify S3 Bucket
        run: |
          echo "=== Verify vyomquant-frontend Bucket ==="
          aws s3api head-bucket --bucket vyomquant-frontend

      - name: DIAGNOSTIC 3 — List CloudFront Distributions
        run: |
          echo "=== List All CloudFront Distributions ==="
          aws cloudfront list-distributions \
            --query "DistributionList.Items[*].[Id,DomainName,Origins.Items[0].DomainName,Comment]" \
            --output table

      - name: DIAGNOSTIC 4 — Get Configured Distribution
        run: |
          echo "=== Get Configured CloudFront Distribution ==="
          aws cloudfront get-distribution \
            --id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query "Distribution.{Id:Id,DomainName:DomainName,Status:Status,Origins:Origins.Items[0].DomainName}" \
            --output table
