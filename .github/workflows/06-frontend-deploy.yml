# 06-frontend-deploy.yml — Frontend Static Assets Deployment to S3 + CloudFront
name: 06 Frontend Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'algo22-terminal/**'
      - '.github/workflows/06-frontend-deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: vyomquant-frontend
  CLOUDFRONT_DISTRIBUTION_ID: EE0XECPHQ8SR0
  NODE_VERSION: '20'

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'algo22-terminal/package-lock.json'

      - name: Install dependencies
        working-directory: ./algo22-terminal
        run: npm ci

      - name: Build frontend
        working-directory: ./algo22-terminal
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build artifacts to S3
        working-directory: ./algo22-terminal
        run: |
          echo "=== Syncing frontend assets to S3 ==="
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.map"
          
          echo "=== Syncing HTML files with shorter cache ==="
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          echo "=== Invalidating CloudFront cache ==="
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          
          echo "Created invalidation: $INVALIDATION_ID"
          
          echo "=== Waiting for invalidation to complete ==="
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id $INVALIDATION_ID
          
          echo "=== CloudFront invalidation completed ==="

      - name: Verify deployment
        run: |
          echo "=== Verifying S3 bucket contents ==="
          aws s3 ls s3://${{ env.S3_BUCKET }}/ --recursive | head -20
          
          echo "=== Checking CloudFront distribution status ==="
          aws cloudfront get-distribution \
            --id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query "Distribution.Status" \
            --output text
