# 04-nightly-audit.yml — Scheduled Nightly Infrastructure & Health Audit
name: 04 Nightly Audit

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  nightly-audit:
    name: Nightly Compliance & Infrastructure Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements-cpu.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt

      - name: Run Import Audit
        run: python scripts/import_audit.py backend_app
        continue-on-error: true

      - name: Run Dependency Audit
        run: python scripts/dependency_audit.py
        continue-on-error: true
        
      - name: Run Size Audit
        run: python scripts/size_audit.py
        continue-on-error: true
        
      - name: Run Reachability Audit
        run: python scripts/reachability_audit.py
        continue-on-error: true

      - name: Run Docker Validation
        run: python scripts/docker_validation.py

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (Python Backend Dependencies)
        run: pip-audit -r requirements-cpu.txt -f json -o reports/pip_audit.json
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'algo22-terminal/package-lock.json'

      - name: Run npm audit (Frontend Dependencies)
        run: |
          cd algo22-terminal
          npm audit --audit-level=high --json > ../reports/npm_audit.json
        continue-on-error: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (Tauri Desktop Rust Dependencies)
        run: |
          cd algo22-terminal/src-tauri
          cargo audit -q --json > ../../reports/cargo_audit.json
        continue-on-error: true

      - name: Generate Reports
        if: always()
        run: python scripts/generate_reports.py

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-audit-reports
          path: |
            *.md
            reports/
