# 04-nightly-audit.yml — Scheduled Nightly Infrastructure & Health Audit
name: 04 Nightly Audit

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  nightly-audit:
    name: Nightly Compliance & Infrastructure Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i 's/^torch==.*/torch==2.3.1+cpu/' requirements.txt
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Import Audit
        run: python scripts/import_audit.py backend_app

      - name: Run Dependency Audit
        run: python scripts/dependency_audit.py

      - name: Run Docker Validation
        run: python scripts/docker_validation.py

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (Python Backend Dependencies)
        run: pip-audit -r requirements.txt --desc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit (Frontend Dependencies)
        run: |
          cd algo22-terminal
          npm audit --audit-level=high

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (Tauri Desktop Rust Dependencies)
        run: |
          cd algo22-terminal/src-tauri
          cargo audit

      - name: Generate Reports
        if: always()
        run: python scripts/generate_reports.py

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-reports
          path: |
            *.md
            reports/
