# SEC-01: watch for live credentials in git history, on a schedule.
#
# WHY THIS WORKFLOW EXISTS
# ------------------------
# Three live production secrets sat in this PUBLIC repository's history for 70-93
# days (master_encryption_keys and jwt_secret from 2026-07-22, the database
# password from 2026-08-14). Every one of them was invisible to a working-tree
# scan, because all three had been removed from HEAD while remaining in history.
#
# The defect class was never one careless file. It was that NOTHING WAS WATCHING.
# A one-off audit finds today's leak; only a scheduled one finds the next.
#
# fetch-depth: 0 IS NOT OPTIONAL
# ------------------------------
# actions/checkout defaults to depth 1. On a shallow clone this sweep would scan
# almost nothing, match nothing, and exit 0 -- a green check every night while
# looking at an empty history, with output indistinguishable from a real pass.
# scripts/audit_secrets_in_git_history.py refuses to run on a shallow clone for
# exactly this reason, so getting this wrong fails loudly rather than silently.
name: 08 Secret History Audit

on:
  schedule:
    # 03:00 UTC daily, an hour after 04-nightly-audit so the two do not contend
    # for the same AWS rate limits -- the sweep reads every production secret and
    # Secrets Manager throttles rapid sequential get-secret-value calls.
    - cron: '0 3 * * *'
  workflow_dispatch:
  # Also on any change to the sweep itself or to the secret declarations, so a
  # change that breaks the check is caught by the change rather than at 03:00.
  pull_request:
    paths:
      - 'scripts/audit_secrets_in_git_history.py'
      - 'scripts/locate_leaked_secret.py'
      - 'terraform/secrets.tf'
      - 'ecs-task-definition-full.json'
      - '.github/workflows/08-secret-history-audit.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  AWS_REGION: ap-southeast-1

jobs:
  secret-history-audit:
    name: Live secrets vs git history
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FULL history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # See the header. Without this the audit is theatre.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Confirm the clone is not shallow
        # A redundant, explicit check so the reason for a failure is obvious in the
        # log without having to read the Python.
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::Shallow clone. The audit cannot see history. Set fetch-depth: 0."
            exit 1
          fi
          echo "commits reachable: $(git rev-list --all --count)"

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::AWS credentials are not configured. The audit compares"
            echo "::error::live Secrets Manager values against history and cannot"
            echo "::error::run without them. It must NOT be skipped silently."
            exit 1
          fi
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "${AWS_REGION}"
          aws sts get-caller-identity

      - name: Audit live secrets against git history
        # Exits non-zero ONLY for a LIVE exposure. Orphaned secrets holding
        # published-but-dead material, and secrets that are public by design such
        # as the Supabase anon key, are reported but do not fail the run -- an
        # alert that always contains known-benign entries teaches its reader to
        # skim past the real ones.
        run: python scripts/audit_secrets_in_git_history.py

      - name: Locate any exposure that was found
        # Only runs when the step above failed, to turn "which secret" into
        # "which commits and which files" without a human re-deriving it under
        # time pressure.
        if: failure()
        run: python scripts/locate_leaked_secret.py || true

      - name: What to do if this failed
        if: failure()
        run: |
          echo "::error::A LIVE production secret is recoverable from git history."
          echo "Rotate FIRST, purge history SECOND. Purging without rotating leaves"
          echo "every clone that already exists holding a working credential."
          echo ""
          echo "Rotation tooling, all of which keeps the value off the command line:"
          echo "  scripts/rotate_database_password.py       --stage/--redeploy/--verify"
          echo "  scripts/rotate_jwt_secret.py              --plan/--stage/--redeploy/--verify"
          echo "  scripts/rotate_master_encryption_keys.py  --plan/--prepend/--redeploy/"
          echo "                                            --reencrypt/--verify/--retire"
          echo ""
          echo "Full procedure: docs/launch_readiness/SEC-01_INCIDENT.md"
