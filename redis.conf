# =============================================================================
# REDIS ARCHITECTURE — STEP 3: SPLIT REDIS USAGE
# =============================================================================
#
# GOAL: Separate Redis into 3 databases for different use cases
# 
# DATABASES:
#   DB 0 → Cache (short-lived, LRU eviction)
#   DB 1 → Task Queue (persistent, no eviction)
#   DB 2 → Events/Streams (time-series, capped)
#
# BENEFITS:
#   - No Redis contention between workloads
#   - Faster queue processing (isolated)
#   - Different eviction policies per use case
#   - Better monitoring and debugging

# =============================================================================
# GENERAL SETTINGS
# =============================================================================

# Port and bind
port 6379
bind 0.0.0.0

# Enable all 16 databases (we'll use 0, 1, 2)
databases 16

# Memory limit (adjust based on available RAM)
maxmemory 2gb

# =============================================================================
# DEFAULT EVICTION POLICY (for DB 0 - Cache)
# =============================================================================
# allkeys-lru: Evict any key using LRU algorithm
# Perfect for cache - least recently used keys evicted first
maxmemory-policy allkeys-lru

# =============================================================================
# PERSISTENCE (for DB 1 - Task Queue)
# =============================================================================
# AOF (Append Only File) - durable persistence
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy
# everysec: fsync every second (good balance of performance/durability)
appendfsync everysec

# Auto AOF rewrite
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# =============================================================================
# RDB SNAPSHOTTING (for disaster recovery)
# =============================================================================
save 900 1      # Save after 900 seconds if 1 key changed
save 300 10     # Save after 300 seconds if 10 keys changed
save 60 10000   # Save after 60 seconds if 10000 keys changed

dbfilename dump.rdb
dir /data

# =============================================================================
# STREAM SETTINGS (for DB 2 - Events/Streams)
# =============================================================================
# Streams use capped collections naturally via MAXLEN
# But we also set stream-node-max-entries for performance
stream-node-max-entries 1000

# =============================================================================
# CLIENT SETTINGS
# =============================================================================
# Max clients (increase for high concurrency)
maxclients 10000

# TCP keepalive
tcp-keepalive 300

# Connection timeout (0 = disabled, but set to 60 for safety)
timeout 60

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
# Disable THP (Transparent Huge Pages) - set in OS, but Redis checks
# Set in Linux: echo never > /sys/kernel/mm/transparent_hugepage/enabled

# Slow log (log queries slower than 10ms)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# =============================================================================
# SECURITY
# =============================================================================
# Protected mode (disable if using password or bind)
protected-mode no

# Password (set via environment variable REDIS_PASSWORD)
# requirepass yourpassword

# =============================================================================
# LOGGING
# =============================================================================
loglevel notice
logfile ""

# =============================================================================
# LAZY FREEING (for non-blocking eviction)
# =============================================================================
# Evict keys in background thread (faster eviction)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# =============================================================================
# I/O THREADING (Redis 6+ only)
# =============================================================================
# Use 4 I/O threads for better performance on multi-core
# io-threads 4
# io-threads-do-reads yes
